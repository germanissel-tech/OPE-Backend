# FR-060: on every change, contract verification (lint, bundle, compatibility against main,
# type drift), build, typecheck, quality gates (ADR-016), the tests the change needs and contract
# tests in one job, and mutation testing on the changed lines in a parallel job, so the PR waits
# for the slower of the two rather than for their sum. A weekly job mutates everything,
# informatively.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Monday 06:00 UTC: the full mutation sweep (informative, see the mutation-full job).
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # contract:diff compares against origin/main; the full history is needed.
          fetch-depth: 0

      - name: Fetch main as the comparison base
        if: github.ref != 'refs/heads/main'
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: npm ci
      - run: npm run contract:check
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      # quality chains lint, arch, duplication, dead code and language (ADR-016): not repeated.
      - run: npm run quality
      # The tools project (whole toolchains) only when the change exercises one (feature 017).
      - run: npm run test:scoped
      - run: npm run test:contract
      - run: npm run release-check

      - name: Publish the Schemathesis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-junit
          path: .schemathesis/
          if-no-files-found: ignore

  mutation:
    # The mutation gate on the lines the change introduced (ADR-016): every mutant must die.
    # Incremental: the verdicts of the previous run of the branch are restored from the cache,
    # so only the mutants whose code or tests changed are re-tested. The first run of a long
    # branch tests every mutant of its diff (a feature of several stories exceeds 1 500), and
    # only a run that finishes saves the cache: the budget is the one of a full pass.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main as the comparison base
        if: github.ref != 'refs/heads/main'
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore the incremental mutation results of this branch
        uses: actions/cache@v4
        with:
          path: reports/mutation/stryker-incremental.json
          # A new entry per run; the newest of the branch is restored, then the newest of any branch.
          key: stryker-incremental-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ github.ref_name }}-
            stryker-incremental-

      - run: npm ci
      - run: npm run contract:bundle
      - run: npm run test:mutation

      - name: Publish the mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-diff-report
          path: reports/mutation/
          if-no-files-found: ignore

  mutation-full:
    # The whole repo mutated, informatively: the score is a trend, not a gate (FR-031).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run contract:bundle
      - run: npm run test:mutation -- --all
        continue-on-error: true
      - name: Publish the mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
