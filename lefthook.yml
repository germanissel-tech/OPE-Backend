# Pre-commit hook (ADR-011): format and lint on staged files, full typecheck.
# Does not run contract:check or the tests: CI does, and CLAUDE.md demands them before committing.
# Installs itself with `npm install` (lefthook postinstall). Skip: git commit --no-verify.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,mts,cts,js,mjs,cjs,json,yaml,yml,md}"
      run: node node_modules/prettier/bin/prettier.cjs --check {staged_files}
    - name: lint
      glob: "*.{ts,mts,cts,js,mjs,cjs}"
      run: node node_modules/eslint/bin/eslint.js --no-warn-ignored {staged_files}
    - name: typecheck
      run: npm run typecheck
