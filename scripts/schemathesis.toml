# Configuration of Schemathesis for test:contract (scripts/test-contract.mjs passes it with --config-file).
#
# What a schema-valid request may be answered with, besides Schemathesis's defaults, and why.
#
# 422, for every operation: an operation with x-invariants refuses bodies the schema admits, by design
# (ADR-007), and the contract declares each of those 422s. Without a configuration file Schemathesis did not
# count them against positive_data_acceptance; with one it does, so the expectation is written here instead
# of depending on whether a file exists.
[checks.positive_data_acceptance]
expected-statuses = ["2xx", "401", "403", "404", "409", "422", "429", "5xx"]

# The four writes that replace what they read require the witness of what they read (feature 043, ADR-046).
# Two checks disagree with the contract there, not with the server:
#   - missing_required_header expects a 400-family answer; the contract answers 428 witness-required, a
#     status of its own, declared on the parameter with x-when-missing.
#   - positive_data_acceptance sends a schema-valid If-Match, which is never the current witness of the
#     resource; 412 stale-version is the answer the contract declares for it.
[[operations]]
include-operation-id = [
  "publishPlatformConfiguration",
  "publishTreatmentDefaults",
  "publishMerchantConfiguration",
  "updateMerchantProfile",
]
checks.missing_required_header.expected-statuses = [428]
checks.positive_data_acceptance.expected-statuses = ["2xx", "401", "403", "404", "409", "412", "422", "429", "5xx"]
