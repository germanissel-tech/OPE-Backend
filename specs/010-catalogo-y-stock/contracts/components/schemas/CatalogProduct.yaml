type: object
additionalProperties: false
required: [productId, name, variants]
properties:
  productId:
    type: string
    description: The product identifier as the platform exposes it (the one the SDK resolves on the page).
    pattern: "^[A-Za-z0-9_.:-]{1,128}$"
  name:
    type: string
    maxLength: 256
  attributes:
    type: array
    description: Name/value pairs as the platform exposes them; no normalisation.
    maxItems: 64
    items:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name: { type: string, maxLength: 64 }
        value: { type: string, maxLength: 512 }
  variants:
    type: array
    maxItems: 1000
    items:
      $ref: ./CatalogVariant.yaml
