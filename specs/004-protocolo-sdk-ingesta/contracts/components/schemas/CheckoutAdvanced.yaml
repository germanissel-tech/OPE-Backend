type: object
description: Avance de checkout. OPE observa la transición para inferir y medir; no interviene ahí.
additionalProperties: false
required: [type, eventId, sessionId, visitorId, occurredAt, page, device, step]
properties:
  type:
    type: string
    description: Discriminador del tipo de evento.
    enum: [checkout_advanced]
  eventId:
    $ref: ./EventId.yaml
  sessionId:
    $ref: ./SessionId.yaml
  visitorId:
    $ref: ./VisitorId.yaml
  occurredAt:
    type: string
    format: date-time
    description: >-
      Instante del evento según el navegador (RFC 3339). Tolerancia aceptada: hasta 5 minutos a
      futuro y 24 horas a pasado respecto del reloj del backend; fuera de eso,
      `event-timestamp-out-of-range`.
  page:
    $ref: ./PageContext.yaml
  device:
    $ref: ./DeviceClass.yaml
  step:
    type: string
    description: Paso alcanzado.
    enum: [cart, checkout_started, shipping, payment, review]
