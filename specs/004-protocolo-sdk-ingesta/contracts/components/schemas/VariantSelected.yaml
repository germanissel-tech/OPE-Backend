type: object
description: Selección de color o variante.
additionalProperties: false
required: [type, eventId, sessionId, visitorId, occurredAt, page, device, selectedVariantId]
properties:
  type:
    type: string
    description: Discriminador del tipo de evento.
    enum: [variant_selected]
  eventId:
    $ref: ./EventId.yaml
  sessionId:
    $ref: ./SessionId.yaml
  visitorId:
    $ref: ./VisitorId.yaml
  occurredAt:
    type: string
    format: date-time
    description: >-
      Instante del evento según el navegador (RFC 3339). Tolerancia aceptada: hasta 5 minutos a
      futuro y 24 horas a pasado respecto del reloj del backend; fuera de eso,
      `event-timestamp-out-of-range`.
  page:
    $ref: ./PageContext.yaml
  device:
    $ref: ./DeviceClass.yaml
  selectedVariantId:
    type: string
    description: Variante elegida en el selector.
    maxLength: 128
