type: object
description: Interacción con el selector de talle.
additionalProperties: false
required: [type, eventId, sessionId, visitorId, occurredAt, page, device, size]
properties:
  type:
    type: string
    description: Discriminador del tipo de evento.
    enum: [size_selector_interacted]
  eventId:
    $ref: ./EventId.yaml
  sessionId:
    $ref: ./SessionId.yaml
  visitorId:
    $ref: ./VisitorId.yaml
  occurredAt:
    type: string
    format: date-time
    description: >-
      Instante del evento según el navegador (RFC 3339). Tolerancia aceptada: hasta 5 minutos a
      futuro y 24 horas a pasado respecto del reloj del backend; fuera de eso,
      `event-timestamp-out-of-range`.
  page:
    $ref: ./PageContext.yaml
  device:
    $ref: ./DeviceClass.yaml
  size:
    type: string
    description: Etiqueta del talle con la que se interactuó, tal como la muestra la tienda.
    maxLength: 32
