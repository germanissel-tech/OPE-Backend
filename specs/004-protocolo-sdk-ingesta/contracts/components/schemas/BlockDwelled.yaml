type: object
description: Scroll y permanencia sobre un bloque de la ficha.
additionalProperties: false
required: [type, eventId, sessionId, visitorId, occurredAt, page, device, block, dwellMs]
properties:
  type:
    type: string
    description: Discriminador del tipo de evento.
    enum: [block_dwelled]
  eventId:
    $ref: ./EventId.yaml
  sessionId:
    $ref: ./SessionId.yaml
  visitorId:
    $ref: ./VisitorId.yaml
  occurredAt:
    type: string
    format: date-time
    description: >-
      Instante del evento según el navegador (RFC 3339). Tolerancia aceptada: hasta 5 minutos a
      futuro y 24 horas a pasado respecto del reloj del backend; fuera de eso,
      `event-timestamp-out-of-range`.
  page:
    $ref: ./PageContext.yaml
  device:
    $ref: ./DeviceClass.yaml
  block:
    type: string
    description: Bloque semántico de la ficha sobre el que se detuvo.
    enum: [description, size_guide, reviews, policies, price, gallery, cta]
  dwellMs:
    type: integer
    description: Milisegundos de permanencia sobre el bloque.
    minimum: 0
    maximum: 3600000
