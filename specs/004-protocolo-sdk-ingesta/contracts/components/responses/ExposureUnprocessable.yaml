description: La confirmación cumple el esquema pero no puede registrarse.
content:
  application/problem+json:
    schema:
      $ref: ../schemas/ProblemDetails.yaml
    examples:
      decisionUnknown:
        summary: Decisión inexistente o de otro merchant
        value:
          type: urn:ope:problem:exposure-decision-unknown
          title: La decisión no existe para este merchant
          status: 422
          instance: /v1/exposures
      noOp:
        summary: La decisión fue NO_OP
        value:
          type: urn:ope:problem:exposure-of-no-op
          title: Una decisión NO_OP no tiene intervención que exponer
          status: 422
          instance: /v1/exposures
