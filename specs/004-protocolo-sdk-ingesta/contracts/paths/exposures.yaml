post:
  operationId: confirmExposure
  tags: [ingest]
  security:
    - ingestKey: []
  x-required-capabilities:
    - events:write
  summary: Confirmación de exposición de una intervención
  description: |
    El SDK confirma que la intervención de una decisión se renderizó y fue visible. Sólo entonces
    existe una exposición (estado `EXPOSED` de la cadena de evidencia, 01 §5); la decisión sola no
    la implica. La decisión tiene que existir para el merchant de la credencial y haber sido una
    intervención. Una confirmación repetida no duplica el registro.
  x-invariants:
    - type: exposure-decision-unknown
      status: 422
      rule: existe una decisión con decisionId emitida para el merchant de la credencial
      description: Una decisión de otro merchant se trata como inexistente (no se revela que existe).
    - type: exposure-of-no-op
      status: 422
      rule: decision.outcome == INTERVENE
      description: Una decisión NO_OP no tiene intervención que exponer.
    - type: origin-not-allowed
      status: 403
      rule: si el request trae Origin, Origin pertenece a los orígenes registrados del merchant de la credencial
      description: Igual que en la ingesta.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ExposureConfirmation.yaml
        examples:
          exposure:
            $ref: ../examples/exposure-confirmation.yaml
  responses:
    "201":
      description: Exposición registrada.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ExposureResult.yaml
          examples:
            recorded:
              $ref: ../examples/exposure-recorded.yaml
    "200":
      description: Ya estaba registrada; nada cambió.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ExposureResult.yaml
          example:
            decisionId: dec_01JBQ2X8N4K3M7P9R2T5V8W9
            status: already-recorded
    "400":
      $ref: ../components/responses/BadRequest.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "422":
      $ref: ../components/responses/ExposureUnprocessable.yaml
    "500":
      $ref: ../components/responses/InternalServerError.yaml
