# Catálogo de motivos de NO_OP (Decision.reason). Se amplía sin cambio incompatible: el
# contrato lo declara como string con patrón, no como enum (ADR-014). Cada motivo lo emite
# una autoridad; el ledger lo registra tal cual (constitución II: NO_OP con motivo explícito).
reasons:
  - slug: decision-plane-unavailable
    emitter: orquestador
    description: No hay plano de decisión disponible (feature 004–009); toda sesión resuelve NO_OP.
  - slug: page-context-incomplete
    emitter: orquestador
    description: El contexto de página no alcanza para decidir (por ejemplo, ficha sin producto resuelto).
