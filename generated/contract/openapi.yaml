    TextInput:
      type: object
      description: |-
        What an operator publishes as the next version of a base text (feature 038): the key —a family of OPE's vocabulary, the attribute value it speaks of when the family does, and the language— and the text as a person will read it. A key is never created here: it has to exist in the vocabulary.

        A base text reaches every merchant without its own text for that key and language, so while an experiment it reaches is active only a corrective version is accepted — and it restarts the measurement window of each one (03 §4.10). The reason is where the operator's awareness of that is recorded.
      additionalProperties: false
      required:
        - family
        - locale
        - text
      properties:
        family:
          $ref: '#/components/schemas/MessageFamily'
        attributeValue:
          $ref: '#/components/schemas/AttributeValue'
        locale:
          type: string
          description: The language the text is written in, as a BCP 47 tag.
          pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
          maxLength: 35
        text:
          type: string
          description: The text, complete prose, as a person will read it; never a template.
          minLength: 1
          maxLength: 512
        corrective:
          type: boolean
          description: 'A corrective version: the only kind accepted while an experiment this text reaches is active; it restarts the measurement window of each one.'
        reason:
          type: string
          description: Why the version is published; required when corrective.
          minLength: 1
          maxLength: 512
      x-invariants:
        - type: configuration-reason-required
          status: 422
          rule: a corrective version carries a reason
          pointer: reason
          description: A base text reaches every merchant without its own, so a corrective one while measurements run must be explained in the log (03 §4.10).
        - type: text-key-unknown
          status: 422
          rule: the family and the attribute value are OPE's closed vocabulary, and a value goes only with a family that speaks of the product
          description: 'The API never creates keys: a text is published for a key the vocabulary already has.'
        - type: corpus-text-empty
          status: 422
          rule: a text is not blank
          description: Nothing to show is not a text, it is an absent one.
        - type: corpus-text-too-long
          status: 422
          rule: a text is at most as long as an intervention may carry
          description: It would be cut where nobody decided to cut it.
        - type: corpus-text-has-placeholder
          status: 422
          rule: a text carries no unresolved placeholder
          description: The corpus is complete prose, never a template (03 §4.4).
    TextVersion:
      type: object
      description: 'A published version of a text (feature 038): its key, its layer —the base, or a merchant—, its number, what it says, and who published it, when and why. Immutable. `messageVersionId` is what every intervention that showed it stamps, minted from layer, key and number and never declared. A version that removed a merchant''s text has no `text` and says `removed`.'
      additionalProperties: false
      required:
        - family
        - locale
        - layer
        - version
        - messageVersionId
        - removed
        - corrective
        - publishedAt
        - operatorId
      properties:
        family:
          $ref: '#/components/schemas/MessageFamily'
        attributeValue:
          $ref: '#/components/schemas/AttributeValue'
        locale:
          type: string
          description: The language the text is written in, as a BCP 47 tag.
          pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
          maxLength: 35
        layer:
          type: string
          description: 'Whose layer the version belongs to: `base`, or the identifier of the merchant.'
          minLength: 1
          maxLength: 64
        version:
          type: integer
          description: Sequential number of the key in its layer, assigned at publication.
          minimum: 1
        messageVersionId:
          type: string
          description: 'What an intervention stamps when it shows this text: minted from layer, key and number.'
          minLength: 1
          maxLength: 256
        text:
          type: string
          description: The text as it was published; absent when the version removed the merchant's text.
          minLength: 1
          maxLength: 512
        removed:
          type: boolean
          description: Whether this version removed the merchant's text, sending the key back to the base.
        corrective:
          type: boolean
          description: Whether the version was published as corrective.
        reason:
          type: string
          description: The reason the operator declared, when any.
          maxLength: 512
        publishedAt:
          type: string
          format: date-time
          description: Instant of publication.
        operatorId:
          $ref: '#/components/schemas/OperatorId'
        windowsRestarted:
          type: array
          description: 'The experiments whose measurement window this version restarted, when it was corrective: the active ones of every merchant the text reaches. Every reading of the version returns it: its publication, a repetition of the same body, the history and the version by number. A version published before its restarts were recorded (feature 036; 038 for texts) carries none.'
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ExperimentId'
    TextVersionPage:
      type: object
      description: A page of the published versions of a text key in one layer, newest first.
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: Versions of this page, newest first.
          items:
            $ref: '#/components/schemas/TextVersion'
        nextCursor:
          type: string
          description: Cursor of the next page; absent on the last page.
          maxLength: 512
    MerchantTextInput:
      type: object
      description: |-
        What an operator publishes as the next version of a merchant's text for a key (feature 038): the key —a family of OPE's vocabulary, the attribute value it speaks of when the family does, and the language— and either the text as a person will read it or `remove: true`, which removes the merchant's text and sends the key back to the base. One or the other, never both. A key is never created here: it has to exist in the vocabulary.

        A merchant's text reaches only that merchant, so while its experiment is active only a corrective version is accepted — and it restarts the measurement window (03 §4.10). The reason is where the operator's awareness of that is recorded.
      additionalProperties: false
      required:
        - family
        - locale
      properties:
        family:
          $ref: '#/components/schemas/MessageFamily'
        attributeValue:
          $ref: '#/components/schemas/AttributeValue'
        locale:
          type: string
          description: The language the text is written in, as a BCP 47 tag.
          pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
          maxLength: 35
        text:
          type: string
          description: The text, complete prose, as a person will read it.
          minLength: 1
          maxLength: 512
        remove:
          type: boolean
          enum:
            - true
          description: 'Removes the merchant''s text for the key, which then resolves to the base: a version in the history like any other, without a text.'
        corrective:
          type: boolean
          description: 'A corrective version: the only kind accepted while the merchant''s experiment is active; it restarts its measurement window.'
        reason:
          type: string
          description: Why the version is published; required when corrective.
          minLength: 1
          maxLength: 512
      oneOf:
        - description: A text to publish.
          required:
            - text
          not:
            required:
              - remove
        - description: A removal.
          required:
            - remove
          not:
            required:
              - text
      x-invariants:
        - type: configuration-reason-required
          status: 422
          rule: a corrective version carries a reason
          pointer: reason
          description: A merchant's text changes its treatment, so a corrective one while its measurement runs must be explained in the log (03 §4.10).
        - type: text-key-unknown
          status: 422
          rule: the family and the attribute value are OPE's closed vocabulary, and a value goes only with a family that speaks of the product
          description: 'The API never creates keys: a text is published for a key the vocabulary already has.'
        - type: corpus-text-empty
          status: 422
          rule: a text is not blank
          description: Nothing to show is not a text, it is an absent one; removing is `remove`, not a blank.
        - type: corpus-text-too-long
          status: 422
          rule: a text is at most as long as an intervention may carry
          description: It would be cut where nobody decided to cut it.
        - type: corpus-text-has-placeholder
          status: 422
          rule: a text carries no unresolved placeholder
          description: The corpus is complete prose, never a template (03 §4.4).
