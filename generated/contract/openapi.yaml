  parameters:
    X-OPE-Timestamp:
      name: X-OPE-Timestamp
      in: header
      required: false
      description: |
        Unix time in seconds at which the platform signed the request (ADR-029). Required, together
        with `X-OPE-Signature`, for merchants with a signing secret configured; must be within 5
        minutes of the server clock either way (`401 signature-expired` otherwise).
      schema:
        type: integer
        minimum: 0
    X-OPE-Signature:
      name: X-OPE-Signature
      in: header
      required: false
      description: |
        `v1=` followed by the lowercase hex HMAC-SHA256, keyed with a signing secret of the merchant,
        of `<X-OPE-Timestamp>.<raw request body bytes>` (ADR-029). Required for merchants with a
        signing secret; a missing header is `401 signature-missing`, a mismatch `401 signature-invalid`.
        Verified before the body is read.
      schema:
        type: string
        pattern: ^v1=[0-9a-f]{64}$
    cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as `nextCursor` by the previous page. Absent for the first page.
      schema:
        type: string
        maxLength: 512
    limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items per page (ADR-020).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    merchantId:
      name: merchantId
      in: path
      required: true
      description: The merchant the operation acts on (constitution V, ADR-020; the only place a merchant identifier travels in a request).
      schema:
        $ref: '#/components/schemas/MerchantId'
    If-Match:
      name: If-Match
      in: header
      required: true
      x-when-missing: witness-required
      description: 'The witness of the resource as it was read: the `ETag` of its last read, sent back unchanged. A write that replaces what it read is accepted only if nobody wrote the resource since (ADR-046). Without it the write is `428 witness-required`, and the answer does not carry the current witness: handing it out would invite sending it back without looking. Any value other than the current witness —one that is old, another resource''s, `*`, several, a weak one— is `412 stale-version`, and nothing is written.'
      schema:
        type: string
        maxLength: 256
    levelVersion:
      name: version
      in: path
      required: true
      description: The number of the version, as the level assigned it when it was published.
      schema:
        type: integer
        minimum: 1
    experimentId:
      name: experimentId
      in: path
      required: true
      description: The experiment the operation acts on.
      schema:
        $ref: '#/components/schemas/ExperimentId'
    textFamily:
      name: family
      in: path
      required: true
      description: The message family of the key, of OPE's closed vocabulary.
      schema:
        $ref: '#/components/schemas/MessageFamily'
    textLocale:
      name: locale
      in: path
      required: true
      description: The language of the key, as a BCP 47 tag.
      schema:
        type: string
        pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
        maxLength: 35
    textAttributeValue:
      name: attributeValue
      in: query
      required: false
      description: 'The attribute value of the key, when the family speaks of the product: a query parameter because it is optional, and a route with an optional segment does not exist.'
      schema:
        $ref: '#/components/schemas/AttributeValue'
    textVersion:
      name: version
      in: path
      required: true
      description: The number of the version, as the key's layer assigned it when it was published.
      schema:
        type: integer
        minimum: 1
  headers:
    ETag:
      description: 'The witness of the resource as this response leaves it (ADR-046): opaque, strong, and the value to send back in `If-Match` when replacing what was read. It changes with every write of the resource, including the ones that do not ask for it.'
      schema:
        type: string
