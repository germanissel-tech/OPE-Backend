    Event:
      description: |
        A behavioural event from the SDK. Closed allow-list (03-alcance-mvp.md §4.1): a type outside
        this union or an undeclared field rejects the whole batch (01 §10.3).
        The `mapping` is explicit so that the generated types carry the wire value; the server strips
        it before compiling the validators because Ajv does not support it (ADR-014).
      type: object
      oneOf:
        - $ref: '#/components/schemas/ProductViewed'
        - $ref: '#/components/schemas/ListingViewed'
        - $ref: '#/components/schemas/VariantSelectorInteracted'
        - $ref: '#/components/schemas/VariantSelected'
        - $ref: '#/components/schemas/PhotoInteracted'
