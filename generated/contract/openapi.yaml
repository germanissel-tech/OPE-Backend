components:
  securitySchemes:
    ingestKey:
      type: apiKey
      in: header
      name: X-OPE-Ingest-Key
      description: |
        Ingest credential of the merchant. It is **public**: it travels in the tag the merchant
        installs (02-integracion-ecommerce.md §3), identifies the merchant and does not authenticate
        the visitor. The real protection is the pair credential + registered origin of the merchant
        (the browser's `Origin`; see ADR-014). Rotatable: up to two active keys per merchant during a
        rotation. Distinct from the portal credentials. `merchantId` is derived from it and never
        travels in the request (constitution V).
    platformKey:
      type: apiKey
      in: header
      name: X-OPE-Platform-Key
      description: |
        Server-to-server secret of the merchant's platform (ADR-020). It never travels in a browser
        nor in the tag: only the platform's backend holds it, over TLS. Identifies the merchant; up
        to two active keys during a rotation. No CORS applies (there is no browser).
        Signature (ADR-029): a merchant with a signing secret configured must also sign every request
        of this scheme — `X-OPE-Timestamp` (Unix seconds) and `X-OPE-Signature` (`v1=` + hex
        HMAC-SHA256 of `<timestamp>.<raw body>`), within a window of 5 minutes; the signature is
        verified before the body is read and any of the merchant's active secrets is accepted. Without
        a secret configured, the key alone authenticates.
    adminToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Token of an operator of OPE (ADR-020, ADR-031). One token per operator, never shared: issued
        out of band (`scripts/mint-admin-token.mjs`), stored by fingerprint only, rotatable (up to two
        live), with an explicit scope — every merchant or a list. It belongs to no merchant: admin
        operations name the merchant they act on in the path, the single exception to "merchantId
        never in the request" (constitution V). A merchant outside the operator's scope answers
        `403 merchant-out-of-scope` without revealing whether it exists. Every action is written to
        the admin log with the operator identifier (never a personal datum).
  schemas:
    Health:
      type: object
      description: Service status.
      additionalProperties: false
      required:
        - status
        - contractVersion
        - timestamp
      properties:
        status:
          type: string
          description: '`ok` when the service can serve requests. `degraded` is reserved for when external dependencies exist whose outage does not prevent responding.'
          enum:
            - ok
            - degraded
        contractVersion:
          type: string
          description: Semantic version of the OpenAPI contract the server loaded at startup.
          pattern: ^\d+\.\d+\.\d+$
        timestamp:
          type: string
          format: date-time
          description: UTC instant at which the response was produced (RFC 3339).
    ProblemDetails:
      type: object
      description: Error according to RFC 9457 (Problem Details for HTTP APIs). Every 4xx/5xx response of the API uses this schema with the `application/problem+json` content type. The values of `type` belong to the catalogue `contracts/problem-types.yaml` (URN `urn:ope:problem:<slug>`).
      additionalProperties: false
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: Stable identifier of the problem type, from OPE's catalogue.
        title:
          type: string
          description: Short, fixed summary for the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code of the response, repeated in the body.
        detail:
          type: string
          description: Human-readable explanation of this occurrence. Never includes internal details.
        instance:
          type: string
          description: URI reference of the occurrence; usually the request path.
        requestId:
          type: string
          description: The identifier the server minted for this request, the same as the `X-Request-Id` header of every response and the `reqId` of the server's own log; quote it when reporting (ADR-044).
        errors:
          type: array
          description: Individual contract violations. Present only in `400` and `422`.
          items:
            type: object
            description: One contract violation in the request.
            additionalProperties: false
            required:
              - pointer
              - message
            properties:
              pointer:
                type: string
                description: JSON Pointer relative to the request (`/query/foo`, `/body/kind`, `/headers/x`).
              message:
                type: string
                description: Description of the violation.
    EventId:
      type: string
      description: Unique identifier of the event, generated by the SDK. Deduplicates retries and replays within the merchant.
      pattern: ^[A-Za-z0-9_-]{8,64}$
    SessionId:
      type: string
      description: Identifier of the visit, generated by the SDK. Groups the behavioural sequence; it expires.
      pattern: ^[A-Za-z0-9_-]{8,64}$
    VisitorId:
      type: string
      description: Pseudonymous, persistent identifier of the browser, generated by the SDK. Gives stability to the experimental assignment. Does not identify a person.
      pattern: ^[A-Za-z0-9_-]{8,64}$
    PageType:
      type: string
      description: Page type according to the SDK's platform adapter.
      enum:
        - product
        - listing
        - cart
        - checkout
        - other
    Money:
      type: object
      description: Monetary amount. The amount travels as a decimal string so no precision is lost (ADR-014).
      additionalProperties: false
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: Amount with up to two decimals, dot as separator, no sign and no thousands separators.
          pattern: ^\d+(\.\d{1,2})?$
        currency:
          type: string
          description: Currency in ISO 4217.
          pattern: ^[A-Z]{3}$
    PageContext:
      type: object
      description: |
        What the SDK could resolve about the page where the event happened (01-arquitectura-mvp.md
        §3.1.1, `PageContext`). Everything but `pageType` is optional: the SDK reports what it resolved
        and the backend fails closed on an incomplete context (`NO_OP` with reason `page-context-incomplete`).
        Allow-list: no other page data comes in (01 §10.2).
      additionalProperties: false
      required:
        - pageType
      properties:
        pageType:
          $ref: '#/components/schemas/PageType'
        productId:
          type: string
          description: Product identifier on the merchant's platform, as the page exposes it.
          maxLength: 128
        variantId:
          type: string
          description: Identifier of the selected variant (size + colour), if any.
          maxLength: 128
        price:
          $ref: '#/components/schemas/Money'
        availability:
          type: string
          description: Availability of the variant as the page shows it. A guard, not a claim (01 §4.3).
          enum:
            - in_stock
            - out_of_stock
            - unknown
        locale:
          type: string
          description: |
            Language of the page as the SDK reads it (`<html lang>`, the platform's store view): a
            BCP 47 tag such as `es-AR` or `en`, validated by shape. Context of the interaction, not
            personal data (01 §10.2); recorded with the decision so the message catalogue can pick
            the text. Optional: without it, the merchant's default language applies once configured.
          pattern: ^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$
          maxLength: 35
    DeviceClass:
      type: string
      description: Device class, for layout only. Never an identifying fingerprint (01 §10.2).
      enum:
        - desktop
        - mobile
        - tablet
    ProductViewed:
      type: object
