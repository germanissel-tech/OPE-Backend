        - $ref: '#/components/schemas/RemovedFromCart'
        - $ref: '#/components/schemas/CheckoutAdvanced'
        - $ref: '#/components/schemas/ExitSignaled'
      discriminator:
        propertyName: type
        mapping:
          product_viewed: '#/components/schemas/ProductViewed'
          listing_viewed: '#/components/schemas/ListingViewed'
          variant_selector_interacted: '#/components/schemas/VariantSelectorInteracted'
          variant_selected: '#/components/schemas/VariantSelected'
          photo_interacted: '#/components/schemas/PhotoInteracted'
          block_dwelled: '#/components/schemas/BlockDwelled'
          cta_approached: '#/components/schemas/CtaApproached'
          product_returned_to: '#/components/schemas/ProductReturnedTo'
          added_to_cart: '#/components/schemas/AddedToCart'
          removed_from_cart: '#/components/schemas/RemovedFromCart'
          checkout_advanced: '#/components/schemas/CheckoutAdvanced'
          exit_signaled: '#/components/schemas/ExitSignaled'
    EventBatch:
      type: object
      description: Batch of events from **one** session. Every event must belong to the same visitor (`session-visitor-mismatch` otherwise).
      additionalProperties: false
      required:
        - events
      x-invariants:
        - type: session-visitor-mismatch
          status: 422
          rule: all events[].sessionId are equal to each other and all events[].visitorId are equal to each other
          description: A session belongs to one visitor; a batch mixes at most retries of the same session.
        - type: event-timestamp-out-of-range
          status: 422
          rule: for every event, now - 24h <= occurredAt <= now + 5min
          description: A badly set browser clock does not contaminate the sequence; out of tolerance, the batch is rejected.
      properties:
        events:
          type: array
          description: Events in the order the SDK captured them. Ordering comes from `occurredAt`, not from the position.
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/Event'
    EventResult:
      type: object
      description: Result of one event of the batch.
      additionalProperties: false
      required:
        - eventId
        - status
      properties:
        eventId:
          $ref: '#/components/schemas/EventId'
        status:
          type: string
          description: '`accepted`: it came in and was recorded. `duplicate`: it had already been received for this merchant (retry or replay); it is not recorded twice.'
          enum:
            - accepted
            - duplicate
    DecisionId:
      type: string
      description: Identifier of a decision issued by OPE. Generated by the backend and quoted by the SDK when confirming an exposure.
      pattern: ^[A-Za-z0-9_-]{8,64}$
    Anchor:
      type: string
      description: Semantic anchor point where an intervention is (or was) rendered. The SDK resolves it with the merchant's anchor map. `variant_selector` is the control that picks a variant — in apparel the size and colour selectors, which 01 §3 lists separately and this vocabulary covers with one name.
      enum:
        - variant_selector
        - price
        - cta
        - policies
    Incentive:
      type: object
      description: |
        The incentive the chosen intervention carries, when the commercial policy of the merchant
        allowed one (03 §4.8: only for the price barrier, within the merchant's ceiling and ladder).
        The SDK shows it; the merchant's platform redeems it at the checkout and declares what it
        applied in the order notification (`Order.incentive`), which OPE crosses with this grant.
        Issuing the coupon and configuring it on the platform side arrive with the configuration
        feature of the map ("Configuration, flags, kill switch and administration").
      additionalProperties: false
      required:
        - kind
        - value
      properties:
        kind:
          type: string
          description: The kind of incentive — a proportional discount and not a fixed amount; only this one in the MVP. It says what the incentive is, not the unit its value is in.
          enum:
            - percent
        value:
          type: number
          description: The share the incentive grants, as a fraction of 1 and never above the merchant's ceiling. A fifteen percent discount is `0.15`.
          exclusiveMinimum: 0
          maximum: 1
    Intervention:
      type: object
      description: |
        The intervention the decision plane emits: where to render (`anchor`), the curated text to
        render there and, when the commercial policy allowed one, the incentive to show.

        The text travels here so the SDK renders without a second round trip at the exact moment the
        friction is happening. `messageVersionId` travels with it and is what the ledger records: the
        text is for rendering, the version is for measuring. A version is immutable — correcting a text
        mints a new one — so what a decision says a person read keeps saying it after the corpus changes
        (constitution IX).
      additionalProperties: false
      required:
        - messageVersionId
        - text
        - anchor
      properties:
        messageVersionId:
          type: string
          description: Version of the curated text that was rendered; stable and immutable, so a result can be attributed to what the person actually read.
          maxLength: 256
        text:
          type: string
          description: The curated text to render, written and reviewed by a person before it was served (constitution VIII). Complete prose, never a template with slots to fill.
          minLength: 1
          maxLength: 512
        anchor:
          $ref: '#/components/schemas/Anchor'
        incentive:
          $ref: '#/components/schemas/Incentive'
    Decision:
      type: object
      description: |
        OPE's decision for the session after processing the batch. It always exists: not intervening
        is a result with a reason, never an absence (constitution II). `reason` is a string from the
        catalogue `contracts/no-op-reasons.yaml`; the catalogue grows without an incompatible change
        (which is why it is not an enum).
      additionalProperties: false
      required:
        - decisionId
        - sessionId
        - outcome
        - reason
      properties:
        decisionId:
          $ref: '#/components/schemas/DecisionId'
        sessionId:
          $ref: '#/components/schemas/SessionId'
        outcome:
          type: string
          description: |
            `NO_OP`: do not intervene; `reason` is a slug of `contracts/no-op-reasons.yaml`.
            `INTERVENE`: render `intervention`; `reason` is the inferred barrier (`fit`, `price` or
            `returns`, 03 §4.2). Neither the confidence nor the signals travel: they live in the ledger.
          enum:
            - NO_OP
            - INTERVENE
        reason:
          type: string
          description: |
            Reason for the outcome: a NO_OP reason of the catalogue `contracts/no-op-reasons.yaml`
            (for example `barrier-unclear`), or the barrier of an intervention.
          pattern: ^[a-z][a-z0-9-]*$
        intervention:
          $ref: '#/components/schemas/Intervention'
    IngestResult:
      type: object
      description: Response to an accepted batch. Carries the result per event and the decision for the session.
      additionalProperties: false
      required:
        - accepted
        - duplicates
        - results
        - decision
      properties:
        accepted:
          type: integer
          description: Number of events that came in.
          minimum: 0
        duplicates:
          type: integer
          description: Number of events already received before.
          minimum: 0
        results:
          type: array
          description: One result per event, in batch order.
          items:
            $ref: '#/components/schemas/EventResult'
        decision:
          $ref: '#/components/schemas/Decision'
    ExposureConfirmation:
      type: object
      description: Confirmation from the SDK that an intervention was rendered and visible. This is what constitutes an exposure (01 §3.1), not the decision.
      additionalProperties: false
      required:
        - decisionId
        - sessionId
        - visitorId
        - exposedAt
        - anchor
      properties:
        decisionId:
          $ref: '#/components/schemas/DecisionId'
        sessionId:
          $ref: '#/components/schemas/SessionId'
        visitorId:
          $ref: '#/components/schemas/VisitorId'
        exposedAt:
          type: string
          format: date-time
          description: Instant at which the intervention was visible, according to the browser.
        anchor:
          $ref: '#/components/schemas/Anchor'
    ExposureResult:
      type: object
      description: Result of recording the exposure.
      additionalProperties: false
      required:
        - decisionId
        - status
      properties:
        decisionId:
          $ref: '#/components/schemas/DecisionId'
        status:
          type: string
          description: '`recorded`: recorded as EXPOSED. `already-recorded`: it already was; the record did not change.'
          enum:
            - recorded
            - already-recorded
    ConfigurationVersions:
      type: object
      description: 'The three versions a decision is taken with (01 §14.2): platform, treatment defaults and, when the merchant published one, its own.'
      additionalProperties: false
      required:
        - platform
        - defaults
      properties:
        platform:
          type: string
          description: Version of the platform configuration.
          minLength: 1
          maxLength: 64
        defaults:
          type: string
          description: Version of the treatment defaults.
          minLength: 1
          maxLength: 64
        merchant:
          type: integer
          description: The merchant's configuration version in force; absent when it never published one.
          minimum: 1
    Surface:
      type: string
      description: 'A page type where OPE may intervene: the product page or the cart.'
      enum:
        - product
        - cart
    Locales:
      type: object
      description: The languages of the merchant's store (BCP 47 tags by shape) and the one to fall back to; an empty list means no restriction until the message catalogue.
      additionalProperties: false
      required:
        - supported
      properties:
        supported:
          type: array
          description: Languages the store serves, as BCP 47 tags.
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
            maxLength: 35
        fallback:
          type: string
          description: The language to use when the page's is not supported; one of `supported`.
          pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
          maxLength: 35
    AnchorSelectors:
      type: object
      description: The CSS selectors that resolve an anchor in the merchant's store, in order of preference.
      additionalProperties: false
      required:
        - selectors
      properties:
        selectors:
          type: array
          description: Selectors tried in order; the first that resolves wins.
          minItems: 1
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 255
    AnchorMap:
      type: object
      description: 'The merchant''s anchor map (01 §3.1.1): where the SDK renders each anchor; an anchor absent here resolves by the SDK''s own chain.'
      additionalProperties: false
      properties:
        variant_selector:
          $ref: '#/components/schemas/AnchorSelectors'
        price:
          $ref: '#/components/schemas/AnchorSelectors'
        cta:
          $ref: '#/components/schemas/AnchorSelectors'
        policies:
          $ref: '#/components/schemas/AnchorSelectors'
    SdkConfig:
      type: object
      description: 'What the SDK of a merchant needs to run (01 §3.1.1, feature 017): whether OPE is on, the versions in force, the surfaces, the languages and the anchor map. Never a policy, a margin, a ladder, a split, an arm nor an experiment: what the constitution reserves to the backend stays there. It changes on the next request (`Cache-Control: no-store`).'
      additionalProperties: false
      required:
        - enabled
        - versions
        - surfaces
        - locales
      properties:
        enabled:
          type: boolean
          description: 'The kill switch (01 §14.2): `false` and the SDK may stay silent without calling the ingestion.'
        versions:
          $ref: '#/components/schemas/ConfigurationVersions'
        surfaces:
          type: array
          description: Page types where OPE may intervene.
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Surface'
        locales:
          $ref: '#/components/schemas/Locales'
        anchors:
          $ref: '#/components/schemas/AnchorMap'
    UnresolvedAnchor:
      type: object
      description: 'An anchor of the merchant''s map the SDK could not resolve on a page type (01 §3.1.1): the anchor and the page type, nothing of the page nor of the person.'
      additionalProperties: false
      required:
        - anchor
        - pageType
      properties:
        anchor:
          $ref: '#/components/schemas/Anchor'
        pageType:
          $ref: '#/components/schemas/PageType'
    AnchorDiagnosticsReport:
      type: object
      description: 'What the SDK reports when anchors stop resolving (01 §3.1.1): which ones, on which page types, and the configuration version it had loaded.'
      additionalProperties: false
      required:
        - unresolved
      properties:
        configurationVersion:
          type: integer
          description: The merchant configuration version the SDK had loaded, when it knows it.
          minimum: 1
        unresolved:
          type: array
          description: The anchors that did not resolve.
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/UnresolvedAnchor'
    DiagnosticsReceived:
      type: object
      description: Acknowledgement of a diagnostics report.
      additionalProperties: false
      required:
        - received
      properties:
        received:
          type: integer
          description: How many unresolved anchors the report carried.
          minimum: 1
    CatalogAttribute:
      type: object
      description: 'A key/value pair as the platform exposes it, with no normalisation. Shared by the product and its variants so the shape is written once: a garment sends fabric and care, an appliance sends capacity and finish, and OPE does not need to know which is which.'
      additionalProperties: false
      required:
        - key
        - value
      properties:
        key:
          type: string
          description: Attribute key as the platform names it.
          maxLength: 64
        value:
          type: string
          description: Attribute value as text.
          maxLength: 512
    CatalogVariant:
      type: object
      description: 'The exact combination of attributes that defines a sellable item — in apparel, size and colour: the only level at which truth exists (01 §0.1). What identifies it is its id; the attributes say what tells it apart from its siblings, so a single variant may declare none.'
      additionalProperties: false
      required:
        - variantId
        - available
        - price
      properties:
        variantId:
          type: string
          description: The variant identifier as the platform exposes it; unique across the snapshot.
          pattern: ^[A-Za-z0-9_.:-]{1,128}$
        attributes:
          type: array
          description: Key/value pairs that tell this variant apart from its siblings, as the platform exposes them; no normalisation.
          maxItems: 64
          items:
            $ref: '#/components/schemas/CatalogAttribute'
        available:
          type: boolean
          description: 'Availability as a guard (01 §4.3): `false` means ''do not recommend''; no quantity travels.'
        price:
          $ref: '#/components/schemas/Money'
    CatalogProduct:
      type: object
      description: A product of the catalogue as the platform exposes it, with its variants nested.
      additionalProperties: false
      required:
        - productId
        - title
        - variants
      properties:
        productId:
          type: string
          description: The product identifier as the platform exposes it (the one the SDK resolves on the page).
          pattern: ^[A-Za-z0-9_.:-]{1,128}$
        title:
          type: string
          description: Display title of the product, as the platform shows it.
          maxLength: 256
        attributes:
          type: array
          description: Key/value pairs as the platform exposes them (fit, material, care); no normalisation.
          maxItems: 64
          items:
            $ref: '#/components/schemas/CatalogAttribute'
        variants:
          type: array
          description: The variants of the product (size and colour); a product without variants carries no availability nor price.
          maxItems: 1000
          items:
            $ref: '#/components/schemas/CatalogVariant'
    CatalogSnapshot:
      type: object
      description: |
        The complete catalogue of the merchant at `capturedAt`. Variants are nested in their product,
        so no variant can be orphan by construction. `capturedAt` is the idempotency key: the same
        instant with the same content repeats the previous result; with different content it conflicts.
      additionalProperties: false
      required:
        - capturedAt
        - products
      x-invariants:
        - type: catalog-duplicate-product-id
          status: 422
          rule: products[].productId are unique
          description: Two products with the same identifier.
        - type: catalog-duplicate-variant-id
          status: 422
          rule: products[].variants[].variantId are unique across the snapshot
          description: Two variants with the same identifier, in the same or in different products.
        - type: catalog-captured-in-future
          status: 422
          rule: capturedAt <= receivedAt + 5 min
          description: A capture instant in the future would fake freshness; the platform's clock is wrong.
      properties:
        capturedAt:
          type: string
          format: date-time
          description: When the platform took the picture (RFC 3339). Freshness is measured from here; it is the idempotency key.
        products:
          type: array
          description: Every product of the merchant; an empty list says "no catalogue".
          maxItems: 100000
          items:
            $ref: '#/components/schemas/CatalogProduct'
    CatalogSummary:
      type: object
      description: What OPE holds after an upsert; never the snapshot itself.
      additionalProperties: false
      required:
        - products
        - variants
        - receivedAt
        - observedSyncLevel
      properties:
        products:
          type: integer
          description: Number of products in the snapshot OPE now holds.
          minimum: 0
        variants:
          type: integer
          description: Number of variants across every product.
          minimum: 0
        receivedAt:
          type: string
          format: date-time
          description: When OPE received the snapshot (its clock); the cadence of receipts feeds the observed level.
        observedSyncLevel:
          type: integer
          minimum: 0
          maximum: 3
          description: |
            Synchronisation level OPE observes from the cadence of snapshots (01 §14.1: measured, not
            declared): 0 no data, 1 daily dump, 2 minutes, 3 per change (never reached with full snapshots).
    OrderId:
      type: string
      description: Identifier of the order as the platform issues it. Unique per merchant; the idempotency key of orders and returns (01 §6).
      pattern: ^[A-Za-z0-9_.-]{1,64}$
    OrderItem:
      type: object
      description: A line of the order or of a return. SKU and quantity only (01 §10.3).
      additionalProperties: false
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
          description: The SKU of the platform, as the catalogue names it.
          minLength: 1
          maxLength: 128
        quantity:
          type: integer
          description: Units of that SKU in the line.
          minimum: 1
    Order:
      type: object
      description: |
        A confirmed order, bounded by design (01 §10.3): what OPE needs to verify a sale and to
        correlate it with a session, nothing about the buyer. `sessionId` is the OPE session the
        storefront attached to the order when it was created (mechanism A, 02 §5.1). `incentive`
        is the incentive actually applied at the checkout, when any; OPE crosses it with the
        decision that granted it and records the outcome, whatever it is.
      additionalProperties: false
      required:
        - orderId
        - total
        - items
        - confirmedAt
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        total:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          description: The lines of the order, SKU and quantity; at least one.
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/OrderItem'
        confirmedAt:
          type: string
          format: date-time
          description: Instant the platform confirmed the order.
        sessionId:
          $ref: '#/components/schemas/SessionId'
        incentive:
          $ref: '#/components/schemas/Incentive'
      x-invariants:
        - type: duplicate-order-item
          status: 422
          rule: items[].sku are unique
          description: Two lines with the same SKU are one line with the sum, or an error of the platform; OPE does not guess.
        - type: order-confirmed-in-future
          status: 422
          rule: confirmedAt <= server clock + 5 minutes
          description: A confirmation ahead of the clock is a clock error, not a sale.
    OrderStatus:
      type: string
      description: |
        Where the order stands in the evidence chain (01 §5): confirmed by the platform as a real
        purchase (`VERIFIED_ORDER`), confirmed and verifiably correlated with an OPE session
        (`ATTRIBUTED_ORDER`), or returned (`RETURNED`, which keeps whatever correlation it had).
        Whether OPE could link it travels apart, in `correlation`. Never an arm nor an experiment.
      enum:
        - VERIFIED_ORDER
        - ATTRIBUTED_ORDER
        - RETURNED
    Correlation:
      type: string
      description: |
        Whether OPE could link the order to one of its sessions (mechanism A, 02 §5.2): `ATTRIBUTED`,
        or `PENDING_CORRELATION`, an explicit state of not knowing (01 §5.2) that is decided once,
        when the order is recorded, and never completed by inference.
      enum:
        - PENDING_CORRELATION
        - ATTRIBUTED
    OrderResult:
      type: object
      description: What OPE holds for the order after the notification.
      additionalProperties: false
      required:
        - orderId
        - status
        - correlation
        - receivedAt
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        status:
          $ref: '#/components/schemas/OrderStatus'
        correlation:
          $ref: '#/components/schemas/Correlation'
        receivedAt:
          type: string
          format: date-time
          description: Instant OPE recorded the order (the first receipt, when repeated).
    OrderCorroboration:
      type: object
      description: What the SDK saw on the purchase confirmation page (mechanism B, 02 §5.1). Corroborating evidence, never authority.
      additionalProperties: false
      required:
        - orderId
        - sessionId
        - visitorId
        - confirmedAt
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        sessionId:
          $ref: '#/components/schemas/SessionId'
        visitorId:
          $ref: '#/components/schemas/VisitorId'
        confirmedAt:
          type: string
          format: date-time
          description: Instant the confirmation page was seen, according to the browser.
      x-invariants:
        - type: corroboration-confirmed-in-future
          status: 422
          rule: confirmedAt <= server clock + 5 minutes
          description: A browser clock ahead of the server is a clock error; the same tolerance as events.
    CorroborationResult:
      type: object
      description: The corroboration was accepted (first time or repeated).
      additionalProperties: false
      required:
        - orderId
        - receivedAt
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        receivedAt:
          type: string
          format: date-time
          description: Instant OPE recorded the corroboration (the first receipt, when repeated).
    Return:
      type: object
      description: |
        The return of a recorded order (02 §5.4). Items are optional and informative: the MVP
        measures purchase quality per order (03 §4.7). No reason, nothing about the buyer.
      additionalProperties: false
      required:
        - orderId
        - returnedAt
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        returnedAt:
          type: string
          format: date-time
          description: Instant the platform registered the return.
        items:
          type: array
          description: The lines returned, when the platform knows them; a subset of the order's lines.
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/OrderItem'
    ReturnResult:
      type: object
      description: The order is returned; `correlation` says whether OPE had linked it to a session.
      additionalProperties: false
      required:
        - orderId
        - status
        - correlation
        - receivedAt
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        status:
          type: string
          description: The order came back (`RETURNED` state of the evidence chain, 01 §5).
          enum:
            - RETURNED
        correlation:
          $ref: '#/components/schemas/Correlation'
        receivedAt:
          type: string
          format: date-time
          description: Instant OPE recorded the return (the first receipt, when repeated).
    OperatorId:
      type: string
      description: 'Identifier of an operator of OPE (ADR-031): opaque, never a personal datum. `system` is the platform acting by itself (the import of the seed at start-up).'
      pattern: ^[A-Za-z0-9_-]{2,64}$
    MerchantId:
      type: string
      description: Identifier of a merchant (ADR-031). OPE mints it when the merchant is created by the API (`mrc_` and twelve base32 characters); a merchant imported from a seed keeps the identifier the seed gave it. Immutable, never reused; it only ever appears in the path of an admin operation (constitution V).
      pattern: ^[A-Za-z0-9_-]{3,64}$
    Operator:
      type: object
      description: 'The operator behind an admin credential (ADR-031, ADR-044). `displayName` is the only personal name the contract carries: the operator is an identified and audited person, and the name is served only to the operator it names (constitution VII, 1.5.0).'
      additionalProperties: false
      required:
        - operatorId
        - scope
      x-personal-datum:
        property: displayName
        reason: The operator is an identified and audited person (constitution VII, 1.5.0); the name is served only to the operator it names, never to public, sdk, platform or portal (ADR-044).
      properties:
        operatorId:
          $ref: '#/components/schemas/OperatorId'
        displayName:
          type: string
          description: The name the operator sees in the panel. Never an identifier, never in the administration log.
          minLength: 1
          maxLength: 80
        scope:
          description: 'Which merchants the operator reaches, as configured (ADR-031): every one, or a list.'
          oneOf:
            - type: string
              enum:
                - '*'
            - type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/MerchantId'
    AdminOutcome:
      type: string
      description: How an administration action ended — accepted by the use case, rejected by a business rule (`code` says which) or denied because the merchant is outside the operator's scope.
      enum:
        - accepted
        - rejected
        - denied
    AdminResult:
      type: object
      description: What an accepted action produced, when it produced something.
      additionalProperties: false
      properties:
        configurationVersion:
          type: integer
          minimum: 1
          description: The merchant configuration version the action published.
        experimentId:
          type: string
          pattern: ^[A-Za-z0-9_-]{8,64}$
          description: The experiment the action created, activated or closed.
        windowRestarted:
          type: boolean
          description: Whether a corrective configuration version restarted the accumulation window.
    AdminEntry:
      type: object
      description: 'One entry of the admin log (ADR-031): who did what, on which merchant, with which outcome. Never a credential.'
      additionalProperties: false
      required:
        - at
        - operatorId
        - operation
        - outcome
      properties:
        at:
          type: string
          format: date-time
          description: Instant of the action.
        operatorId:
          $ref: '#/components/schemas/OperatorId'
        operation:
          type: string
          description: The `operationId` of the contract, or the name of a system action.
          maxLength: 64
        merchantId:
          type: string
          description: The merchant the action named, when it named one.
          maxLength: 64
        outcome:
          $ref: '#/components/schemas/AdminOutcome'
        code:
          type: string
          description: The problem type slug when rejected or denied.
          maxLength: 64
        result:
          $ref: '#/components/schemas/AdminResult'
        reason:
          type: string
          description: The reason the operator declared (a corrective configuration version).
          maxLength: 512
    AdminEntryPage:
      type: object
      description: A page of the admin log, newest first (ADR-020).
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: Entries of this page, newest first.
          items:
            $ref: '#/components/schemas/AdminEntry'
        nextCursor:
          type: string
          description: Cursor of the next page; absent on the last page.
          maxLength: 512
    MerchantContact:
      type: object
      description: 'The person the merchant relationship is handled with (ADR-045): an identified party of the commercial relationship, never an observed one (constitution VII, 1.5.1). Served to the administration only; never in a decision, in what the SDK or the platform sees, in the admin log or in the server logs.'
      additionalProperties: false
      required:
        - name
        - email
      x-personal-datum:
        - property: name
          reason: The contact is an identified party of the commercial relationship, not an observed person (constitution VII 1.5.1, ADR-045); served only to the admin consumer and never recorded.
        - property: email
          reason: The contact is an identified party of the commercial relationship, not an observed person (constitution VII 1.5.1, ADR-045); served only to the admin consumer and never recorded.
        - property: phone
          reason: The contact is an identified party of the commercial relationship, not an observed person (constitution VII 1.5.1, ADR-045); served only to the admin consumer and never recorded.
      properties:
        name:
          type: string
          description: The contact's name, as written.
          minLength: 1
          maxLength: 120
        email:
          type: string
          description: The contact's email address.
          format: email
          minLength: 3
          maxLength: 254
        phone:
          type: string
          description: The contact's phone number, as written.
          minLength: 1
          maxLength: 32
        role:
          type: string
          description: The contact's role at the merchant (e.g. e-commerce manager). Not a personal datum.
          minLength: 1
          maxLength: 80
    MerchantStatus:
      type: string
      description: 'Whether OPE works for the merchant: `active`; `off` by the kill switch (decides nothing, still measures); `deactivated` for good (no credential resolves, every record stays).'
      enum:
        - active
        - 'off'
        - deactivated
    CredentialKind:
      type: string
      description: 'The three credentials of a merchant: the ingest key of the tag, the platform key of its backend, the signing secret of its notifications (ADR-014, ADR-025, ADR-029).'
      enum:
        - ingest
        - platform
        - signing
    CredentialSummary:
      type: object
      description: A credential as an operator sees it — kind and instants, never the value (ADR-031).
      additionalProperties: false
      required:
        - kind
        - issuedAt
      properties:
        kind:
          $ref: '#/components/schemas/CredentialKind'
        issuedAt:
          type: string
          format: date-time
          description: When it was minted.
        expiresAt:
          type: string
          format: date-time
          description: When it stops being valid; only after a rotation gave it a grace.
    Merchant:
      type: object
      description: 'A merchant as the administration reads it (ADR-031), with its identity when it has one (ADR-045: a merchant created before it, or never edited, comes without). Credentials by kind without their values; its configuration and experiments live in their own resources.'
      additionalProperties: false
      required:
        - merchantId
        - status
        - origins
        - createdAt
        - credentials
      x-personal-datum:
        - property: displayName
          reason: The name of the store or of its legal entity, not of a person (ADR-045); served to the admin consumer only.
      properties:
        displayName:
          type: string
          description: The name of the store or legal entity, as the console lists and heads it.
          minLength: 1
          maxLength: 120
        storeUrl:
          type: string
          description: The canonical URL of the store for a person, kept as written.
          pattern: ^https?://
          minLength: 1
          maxLength: 255
        contact:
          $ref: '#/components/schemas/MerchantContact'
        notes:
          type: string
          description: Free text of the operator about the relationship.
          minLength: 1
          maxLength: 2000
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        status:
          $ref: '#/components/schemas/MerchantStatus'
        origins:
          type: array
          description: Registered origins of the store, as written.
          minItems: 1
          items:
            type: string
            maxLength: 255
        createdAt:
          type: string
          format: date-time
          description: When the merchant was created.
        credentials:
          type: array
          description: The credentials still valid, by kind; never their values.
          items:
            $ref: '#/components/schemas/CredentialSummary'
    MerchantPage:
      type: object
      description: A page of merchants, oldest first, within the scope of the operator (ADR-020).
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: Merchants of this page.
          items:
            $ref: '#/components/schemas/Merchant'
        nextCursor:
          type: string
          description: Cursor of the next page; absent on the last page.
          maxLength: 512
    MerchantCreate:
      type: object
      description: What an operator gives to create a merchant — its origins, whether the platform signs, and its identity (ADR-045); OPE mints everything else (ADR-031).
      additionalProperties: false
      required:
        - origins
        - signature
        - displayName
      x-personal-datum:
        - property: displayName
          reason: The name of the store or of its legal entity, not of a person (ADR-045); served to the admin consumer only.
      properties:
        displayName:
          type: string
          description: The name of the store or legal entity, as the console lists and heads it.
          minLength: 1
          maxLength: 120
        storeUrl:
          type: string
          description: The canonical URL of the store for a person, kept as written; not an origin, and not necessarily one of them.
          pattern: ^https?://
          minLength: 1
          maxLength: 255
        contact:
          $ref: '#/components/schemas/MerchantContact'
        notes:
          type: string
          description: Free text of the operator about the relationship (why it was created, which stage, who to talk to).
          minLength: 1
          maxLength: 2000
        origins:
          type: array
          description: 'Registered origins of the store: `scheme://host[:port]`, no path. An origin belongs to one merchant.'
          minItems: 1
          maxItems: 20
          items:
            type: string
            maxLength: 255
        signature:
          type: boolean
          description: Whether the platform will sign its notifications (ADR-029); mints a signing secret too.
      x-invariants:
        - type: invalid-origin
          status: 422
          rule: every origin is scheme://host[:port] without a path
          pointer: origins[N]
          description: The pair credential + origin protects the tag (ADR-014); an origin that is not one would protect nothing.
        - type: origin-already-registered
          status: 422
          rule: no origin belongs to another merchant (deactivated ones included)
          pointer: origins[N]
          description: An origin speaks for one merchant only; the credential + origin pair is the protection of the tag (ADR-014).
        - type: invalid-merchant-profile
          status: 422
          rule: a text field has no leading or trailing whitespace, and storeUrl parses as an absolute http(s) URL
          pointer: displayName
          description: What the schema cannot say legibly — padding, and a URL that only looks like one — is judged by the domain and named by field; a value is kept as written, never trimmed (ADR-045).
    MerchantCredentials:
      type: object
      description: The values of the credentials, shown once (ADR-031). Give them to the merchant out of band; no reading returns them.
      additionalProperties: false
      required:
        - ingestKey
        - platformKey
      properties:
        ingestKey:
          type: string
          description: The public key of the tag (`X-OPE-Ingest-Key`).
          maxLength: 128
        platformKey:
          type: string
          description: The server-to-server key of the platform (`X-OPE-Platform-Key`).
          maxLength: 128
        platformSecret:
          type: string
          description: The signing secret (ADR-029); only when the merchant was created with `signature`.
          maxLength: 128
    MerchantCreated:
      type: object
      description: The merchant just created and the values of its credentials — the only time they travel.
      additionalProperties: false
      required:
        - merchant
        - credentials
      properties:
        merchant:
          $ref: '#/components/schemas/Merchant'
        credentials:
          $ref: '#/components/schemas/MerchantCredentials'
    CredentialRotation:
      type: object
      description: 'A rotation (ADR-014, ADR-031): the previous credential of the kind lives on for the grace; none by default.'
      additionalProperties: false
      properties:
        graceSeconds:
          type: integer
          description: Seconds the previous credential stays valid; 0 revokes it at once. Bounded by the platform.
          minimum: 0
          default: 0
      x-invariants:
        - type: rotation-grace-too-long
          status: 422
          rule: graceSeconds <= the platform maximum (platform configuration, rotationGraceMaxMs)
          pointer: graceSeconds
          description: A grace without bound would keep a leaked credential alive; the platform caps it.
    CredentialIssued:
      type: object
      description: The credential just minted, shown once, and when the previous one expires.
      additionalProperties: false
      required:
        - kind
        - value
        - issuedAt
      properties:
        kind:
          $ref: '#/components/schemas/CredentialKind'
        value:
          type: string
          description: The new value; give it out of band. No reading returns it.
          maxLength: 128
        issuedAt:
          type: string
          format: date-time
          description: When it was minted.
        previousExpiresAt:
          type: string
          format: date-time
          description: When the previous credential of the kind stops being valid; absent when there was none.
    KillSwitch:
      type: object
      description: 'The kill switch of the merchant (01 §14.2): `enabled: false` turns OPE off for it without a deploy; the SDK keeps receiving valid answers and every decision is NO_OP; the platform keeps being able to notify.'
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Whether OPE decides for this merchant.
    MerchantProfileInput:
      type: object
      description: 'The identity of a merchant as an operator writes it, whole (ADR-045): a field left out is cleared. Never its origins, status or credentials, which have operations of their own.'
      additionalProperties: false
      required:
        - displayName
      x-personal-datum:
        - property: displayName
          reason: The name of the store or of its legal entity, not of a person (ADR-045); served to the admin consumer only.
      x-invariants:
        - type: invalid-merchant-profile
          status: 422
          rule: a text field has no leading or trailing whitespace, and storeUrl parses as an absolute http(s) URL
          pointer: displayName
          description: What the schema cannot say legibly — padding, and a URL that only looks like one — is judged by the domain and named by field; a value is kept as written, never trimmed.
      properties:
        displayName:
          type: string
          description: The name of the store or legal entity, as the console lists and heads it.
          minLength: 1
          maxLength: 120
        storeUrl:
          type: string
          description: The canonical URL of the store for a person, kept as written; not an origin, and not necessarily one of them.
          pattern: ^https?://
          minLength: 1
          maxLength: 255
        contact:
          $ref: '#/components/schemas/MerchantContact'
        notes:
          type: string
          description: Free text of the operator about the relationship (why it was created, which stage, who to talk to).
          minLength: 1
          maxLength: 2000
    Freshness:
      type: object
      description: Freshness budgets by class of datum (01 §8, ADR-025), measured from `capturedAt`.
      additionalProperties: false
      required:
        - catalogMs
        - stockAndPriceMs
      properties:
        catalogMs:
          type: integer
          description: Milliseconds since `capturedAt` beyond which the snapshot holds no truth at all.
          minimum: 1
          maximum: 31536000000
        stockAndPriceMs:
          type: integer
          description: Milliseconds since `capturedAt` beyond which availability and price no longer sustain a claim.
          minimum: 1
          maximum: 31536000000
    SyncLevelRules:
      type: object
      description: Thresholds of the observed synchronisation level (01 §14.1, ADR-025); the median algorithm is the code's.
      additionalProperties: false
      required:
        - receiptsKept
        - noDataAfterMs
        - minutesLevelMaxAgeMs
        - minutesLevelMedianIntervalMs
        - minutesLevelMinReceipts
      properties:
        receiptsKept:
          type: integer
          description: Snapshot receipts kept per merchant to judge the cadence.
          minimum: 2
          maximum: 1000000
        noDataAfterMs:
          type: integer
          description: Age of the latest receipt beyond which the level is 0.
          minimum: 1
          maximum: 31536000000
        minutesLevelMaxAgeMs:
          type: integer
          description: Age of the latest receipt beyond which the level cannot be 2.
          minimum: 1
          maximum: 31536000000
        minutesLevelMedianIntervalMs:
          type: integer
          description: Median interval between receipts at or under which the level is 2.
          minimum: 1
          maximum: 31536000000
        minutesLevelMinReceipts:
          type: integer
          description: Least receipts to judge a cadence of minutes.
          minimum: 2
          maximum: 1000000
    Barrier:
      type: string
      description: One of the three purchase barriers OPE infers (01 §4.2).
      enum:
        - fit
        - price
        - returns
    EventCountCondition:
      type: object
      description: Holds when the session carries at least `min` events of the type.
      additionalProperties: false
      required:
        - fact
        - type
        - min
      properties:
        fact:
          type: string
          description: The fact this condition judges.
          enum:
            - eventCount
        type:
          type: string
          description: Event type of the SDK vocabulary.
          maxLength: 64
        subtype:
          type: string
          description: Subtype when the event type has one.
          maxLength: 64
        min:
          type: integer
          description: Least number of events.
          minimum: 1
          maximum: 1000
    DwellSecondsCondition:
      type: object
      description: 'Holds when the visitor dwelled on a block for at least `min` seconds (absent: the reading seconds of the policy).'
      additionalProperties: false
      required:
        - fact
        - block
      properties:
        fact:
          type: string
          description: The fact this condition judges.
          enum:
            - dwellSeconds
        block:
          type: string
          description: Block of the page (`BlockDwelled`).
          maxLength: 64
        min:
          type: number
          description: Least seconds of dwell; absent means the reading seconds.
          minimum: 0
          maximum: 86400
    EventRef:
      type: object
      description: An event of the SDK vocabulary, by type and optional subtype.
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          description: Event type of the SDK vocabulary (`Event`).
          maxLength: 64
        subtype:
          type: string
          description: Subtype when the event type has one.
          maxLength: 64
    SequenceCondition:
      type: object
      description: Holds when `first` happened and `then` happened after it in the session.
      additionalProperties: false
      required:
        - fact
        - first
        - then
      properties:
        fact:
          type: string
          description: The fact this condition judges.
          enum:
            - sequence
        first:
          $ref: '#/components/schemas/EventRef'
        then:
          type: object
          description: The event that must follow, by type and optional subtype.
          additionalProperties: false
          required:
            - type
          properties:
            type:
              type: string
              description: Event type of the SDK vocabulary.
              maxLength: 64
            subtype:
              type: string
              description: Subtype when the event type has one.
              maxLength: 64
    ProductAttributeCondition:
      type: object
      description: Holds when the product in focus carries the attribute with that value.
      additionalProperties: false
      required:
        - fact
        - key
        - value
      properties:
        fact:
          type: string
          description: The fact this condition judges.
          enum:
            - productAttribute
        key:
          type: string
          description: Attribute key of the catalogue.
          maxLength: 64
        value:
          type: string
          description: Attribute value.
          maxLength: 255
    FlagCondition:
      type: object
      description: A fact of the session or the product that either holds or does not.
      additionalProperties: false
      required:
        - fact
      properties:
        fact:
          type: string
          description: The fact this condition judges.
          enum:
            - returnedToProduct
            - variantAvailable
            - sessionAddedToCart
            - sessionEnteredCheckout
    NestedAllCondition:
      type: object
      description: 'Holds when every fact holds (`all: []` holds); the innermost level of the algebra the API admits.'
      additionalProperties: false
      required:
        - all
      properties:
        all:
          type: array
          description: Facts that must all hold.
          maxItems: 16
          items:
            type: object
            description: A fact of the closed vocabulary.
            oneOf:
              - $ref: '#/components/schemas/EventCountCondition'
              - $ref: '#/components/schemas/DwellSecondsCondition'
              - $ref: '#/components/schemas/SequenceCondition'
              - $ref: '#/components/schemas/ProductAttributeCondition'
              - $ref: '#/components/schemas/FlagCondition'
    NestedAnyCondition:
      type: object
      description: 'Holds when at least one fact holds (`any: []` does not); the innermost level of the algebra the API admits.'
      additionalProperties: false
      required:
        - any
      properties:
        any:
          type: array
          description: Facts of which one must hold.
          maxItems: 16
          items:
            type: object
            description: A fact of the closed vocabulary.
            oneOf:
              - $ref: '#/components/schemas/EventCountCondition'
              - $ref: '#/components/schemas/DwellSecondsCondition'
              - $ref: '#/components/schemas/SequenceCondition'
              - $ref: '#/components/schemas/ProductAttributeCondition'
              - $ref: '#/components/schemas/FlagCondition'
    NestedNotCondition:
      type: object
      description: Holds when the fact does not; the innermost level of the algebra the API admits.
      additionalProperties: false
      required:
        - not
      properties:
        not:
          type: object
          description: The fact that must not hold.
          oneOf:
            - $ref: '#/components/schemas/EventCountCondition'
            - $ref: '#/components/schemas/DwellSecondsCondition'
            - $ref: '#/components/schemas/SequenceCondition'
            - $ref: '#/components/schemas/ProductAttributeCondition'
            - $ref: '#/components/schemas/FlagCondition'
    NestedCondition:
      type: object
      description: 'A condition one level inside a combinator: a fact, or `all`, `any`, `not` over facts.'
      oneOf:
        - $ref: '#/components/schemas/NestedAllCondition'
        - $ref: '#/components/schemas/NestedAnyCondition'
        - $ref: '#/components/schemas/NestedNotCondition'
        - $ref: '#/components/schemas/EventCountCondition'
        - $ref: '#/components/schemas/DwellSecondsCondition'
        - $ref: '#/components/schemas/SequenceCondition'
        - $ref: '#/components/schemas/ProductAttributeCondition'
        - $ref: '#/components/schemas/FlagCondition'
    AllCondition:
      type: object
      description: 'Holds when every condition holds (`all: []` holds).'
      additionalProperties: false
      required:
        - all
      properties:
        all:
          type: array
          description: Conditions that must all hold.
          maxItems: 16
          items:
            $ref: '#/components/schemas/NestedCondition'
    AnyCondition:
      type: object
      description: 'Holds when at least one condition holds (`any: []` does not).'
      additionalProperties: false
      required:
        - any
      properties:
        any:
          type: array
          description: Conditions of which one must hold.
          maxItems: 16
          items:
            $ref: '#/components/schemas/NestedCondition'
    NotCondition:
      type: object
      description: Holds when the condition does not.
      additionalProperties: false
      required:
        - not
      properties:
        not:
          $ref: '#/components/schemas/NestedCondition'
    Condition:
      type: object
      description: 'A condition of a rule (ADR-026): a fact of the closed vocabulary, or `all`, `any`, `not` over conditions. The API admits two levels of combinators (a combinator over combinators over facts); a fact OPE does not capture is refused (`unknown-fact`).'
      oneOf:
        - $ref: '#/components/schemas/AllCondition'
        - $ref: '#/components/schemas/AnyCondition'
        - $ref: '#/components/schemas/NotCondition'
        - $ref: '#/components/schemas/EventCountCondition'
        - $ref: '#/components/schemas/DwellSecondsCondition'
        - $ref: '#/components/schemas/SequenceCondition'
        - $ref: '#/components/schemas/ProductAttributeCondition'
        - $ref: '#/components/schemas/FlagCondition'
    BarrierRule:
      type: object
      description: 'A rule of the decision policy: when its condition holds, its barrier gains its weight (ADR-026).'
      additionalProperties: false
      required:
        - id
        - barrier
        - strength
        - when
      properties:
        id:
          type: string
          description: Identifier of the rule, unique in the policy.
          minLength: 1
          maxLength: 64
        barrier:
          $ref: '#/components/schemas/Barrier'
        strength:
          type: string
          description: Which policy weight the rule adds when it has no weight of its own.
          enum:
            - strong
            - supporting
        weight:
          type: number
          description: A weight of its own, 0..1; absent means the weight of its strength.
          minimum: 0
          maximum: 1
        when:
          $ref: '#/components/schemas/Condition'
    PolicyWeights:
      type: object
      description: The weight each strength adds to the confidence of a barrier, 0..1.
      additionalProperties: false
      required:
        - strong
        - supporting
      properties:
        strong:
          type: number
          description: Weight of a strong rule.
          minimum: 0
          maximum: 1
        supporting:
          type: number
          description: Weight of a supporting rule.
          minimum: 0
          maximum: 1
    PolicyEvidence:
      type: object
      description: Which barriers need which class of product evidence before OPE speaks (01 §4.3).
      additionalProperties: false
      properties:
        freshStockAndPrice:
          type: array
          description: Barriers that need fresh availability and price.
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Barrier'
        availableVariant:
          type: array
          description: Barriers that need an available variant in focus.
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Barrier'
    DecisionPolicy:
      type: object
      description: 'A complete decision policy (ADR-026): rules, weights, threshold, priority and evidence requirements.'
      additionalProperties: false
      required:
        - version
        - rules
        - weights
        - readingSeconds
        - threshold
        - priority
        - evidence
      properties:
        version:
          type: string
          description: Version the merchant gives its decision policy; stamped in every decision.
          minLength: 1
          maxLength: 64
        rules:
          type: array
          description: The rules, at least one per active barrier.
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/BarrierRule'
        weights:
          $ref: '#/components/schemas/PolicyWeights'
        readingSeconds:
          type: number
          description: Seconds of dwell a `dwellSeconds` condition without `min` asks for.
          minimum: 0
          maximum: 3600
        threshold:
          type: number
          description: Confidence a barrier must reach to be inferred, 0..1.
          minimum: 0
          maximum: 1
        priority:
          type: array
          description: The three barriers in tie-break order (a permutation).
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Barrier'
        evidence:
          $ref: '#/components/schemas/PolicyEvidence'
    CommercialPolicy:
      type: object
      description: 'A complete commercial policy (ADR-027): incentive ceiling and ladder, margin, return risk, high intent, abandonment and budgets. Every share is a fraction of 1, here as everywhere.'
      additionalProperties: false
      required:
        - version
        - maxIncentiveShare
        - incentiveLadderShare
        - directIncentiveOnPrice
        - returnRisk
        - highIntent
        - abandonment
        - interventionsPerSession
        - cooldownSeconds
        - interventionsPerVisitorPerDay
      properties:
        version:
          type: string
          description: Version the merchant gives its commercial policy; stamped in every decision.
          minLength: 1
          maxLength: 64
        maxIncentiveShare:
          type: number
          description: Ceiling of any incentive, as a fraction of 1.
          minimum: 0
          maximum: 1
        incentiveLadderShare:
          type: array
          description: Incentive steps as fractions of 1, strictly increasing, within the ceiling.
          minItems: 1
          maxItems: 8
          items:
            type: number
            description: One step.
            minimum: 0
            maximum: 1
        marginShare:
          type: number
          description: Margin the merchant declares, as a fraction of 1; absent means no incentive goes out (01 §4.7).
          minimum: 0
          maximum: 1
        directIncentiveOnPrice:
          type: boolean
          description: Whether the price barrier may receive the incentive directly.
        returnRisk:
          $ref: '#/components/schemas/Condition'
        highIntent:
          type: string
          description: From which step a visitor counts as high intent, where OPE keeps quiet.
          enum:
            - from-cart
            - from-checkout
            - never
        abandonment:
          type: string
          description: What a cart abandonment without a signal triggers.
          enum:
            - nothing
            - reassure-returns
        interventionsPerSession:
          type: integer
          description: Interventions a session may receive.
          minimum: 1
          maximum: 1000000
        cooldownSeconds:
          type: integer
          description: Seconds between two interventions of a session.
          minimum: 0
          maximum: 86400
        interventionsPerVisitorPerDay:
          type: integer
          description: Interventions a visitor may receive per day (fatigue).
          minimum: 1
          maximum: 1000000
    EvidenceProfile:
      type: object
      description: What a merchant declares it can sustain (03 §4.5, ADR-027); nothing declared means no claim passes the gate.
      additionalProperties: false
      required:
        - returnsPolicy
        - fitData
        - authorizedAttributes
      properties:
        returnsPolicy:
          type: boolean
          description: Whether the merchant has a returns policy OPE may cite.
        fitData:
          type: boolean
          description: Whether the merchant provides fit data OPE may recommend a size with.
        authorizedAttributes:
          type: array
          description: Product attributes the messages may name.
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            maxLength: 64
    SyncMode:
      type: string
      description: 'How a flow of the platform reaches OPE (constitution X, ADR-025): `push` (the platform notifies; built), `pull` (OPE queries its API) or `subscribe` (OPE consumes its queue). Declaring `pull` or `subscribe` is accepted and stamped; it changes nothing until the platform port feature.'
      enum:
        - push
        - pull
        - subscribe
    SyncStrategy:
      type: object
      description: The mode negotiated with the merchant for each flow (constitution X, ADR-025).
      additionalProperties: false
      required:
        - catalog
        - stockAndPrice
        - orders
        - returns
      properties:
        catalog:
          $ref: '#/components/schemas/SyncMode'
        stockAndPrice:
          $ref: '#/components/schemas/SyncMode'
        orders:
          $ref: '#/components/schemas/SyncMode'
        returns:
          $ref: '#/components/schemas/SyncMode'
    AttributeValue:
      type: string
      description: |
        A concept OPE has curated prose for: today, what a garment is made of. **OPE's vocabulary, not
        the merchant's**: `CatalogProduct.attributes` is free text the platform exposes without
        normalisation, so a text that showed it would publish copy nobody reviewed and claim what no
        evidence sustains (constitution II).

        A merchant maps its own labels onto these values (`MerchantConfigurationDeclared.attributeLabels`)
        the way it maps its selectors onto the anchors. A value nobody wrote a sentence for does not exist
        for the message: the product says nothing about it and the ladder falls a rung. The list grows on
        demand, with the discipline the barriers, the anchors and the steps were bounded with.
      enum:
        - combed-cotton
        - jersey
        - linen
        - denim
        - leather
    AttributeLabel:
      type: object
      description: |
        One label of the merchant and the value of OPE's vocabulary it corresponds to. A list of pairs
        and not a map, for two reasons: a request body declares `additionalProperties: false`, and a list
        can repeat a label — which is a merchant error worth naming rather than one the shape silently
        swallows.
      additionalProperties: false
      required:
        - label
        - value
      properties:
        label:
          type: string
          description: The attribute value as the merchant's platform exposes it, verbatim.
          minLength: 1
          maxLength: 512
        value:
          $ref: '#/components/schemas/AttributeValue'
    DedupWindow:
      type: object
      description: 'The deduplication window of the ingestion (ADR-024): ids older than the TTL or beyond the budget are forgotten.'
      additionalProperties: false
      required:
        - ttlMs
        - maxIds
      properties:
        ttlMs:
          type: integer
          description: Milliseconds an event id is remembered.
          minimum: 1
          maximum: 31536000000
        maxIds:
          type: integer
          description: Ids remembered per merchant at most.
          minimum: 1
          maximum: 1000000
    PlatformConfiguration:
      type: object
      description: 'Level 1 (constitution XI): the values of the platform that no merchant overrides, with the name of the version in force. The release file (`config/platform.json`) is the seed of version 1; from there on an operator publishes it by API (ADR-031 as amended by feature 036).'
      additionalProperties: false
      required:
        - version
        - dedupWindow
        - eventPastToleranceMs
        - clockSkewToleranceMs
        - sessionDurationMs
        - visitorWindowMs
        - signatureWindowMs
        - rotationGraceMaxMs
        - anchorDiagnosticsKept
        - unmappedValuesKept
        - retryAfterSeconds
      properties:
        version:
          type: string
          description: Name of the version in force (`platform-3`), minted from its number.
          minLength: 1
          maxLength: 64
        dedupWindow:
          $ref: '#/components/schemas/DedupWindow'
        eventPastToleranceMs:
          type: integer
          description: Milliseconds an event instant may sit in the past (late uploads).
          minimum: 1
          maximum: 31536000000
        clockSkewToleranceMs:
          type: integer
          description: Milliseconds an instant a client declares may sit in the future.
          minimum: 0
          maximum: 31536000000
        sessionDurationMs:
          type: integer
          description: Milliseconds of inactivity after which a session is over and the SDK must mint a new `sessionId`. It is a rule of the backend that the SDK obeys, not an observation the client makes (feature 032). It used to be called `sessionWindowMs` and meant two things at once — this rule and how long the backend keeps the session in memory; those are now separate, and the second one is not published because nothing a merchant observes depends on it.
          minimum: 1
          maximum: 31536000000
        visitorWindowMs:
          type: integer
          description: Milliseconds a visitor's interventions count for the fatigue limit.
          minimum: 1
          maximum: 31536000000
        signatureWindowMs:
          type: integer
          description: Milliseconds a platform signature's timestamp may sit from the server clock, either way (ADR-029).
          minimum: 1
          maximum: 31536000000
        rotationGraceMaxMs:
          type: integer
          description: Longest grace a credential rotation may give the previous credential.
          minimum: 0
          maximum: 31536000000
        anchorDiagnosticsKept:
          type: integer
          description: Anchor diagnostics kept per merchant at most.
          minimum: 1
          maximum: 1000000
        unmappedValuesKept:
          type: integer
          description: Unmapped attribute labels kept per merchant at most; past it the oldest is dropped and the catalogue is never refused.
          minimum: 1
          maximum: 1000000
        retryAfterSeconds:
          type: integer
          description: 'Seconds a client waits before retrying a write a store could not accept: the `Retry-After` of every 503 (ADR-021).'
          minimum: 1
          maximum: 3600
    EffectiveConfiguration:
      type: object
      description: 'The configuration a merchant is served with, resolved value by value: what it declared, else the treatment defaults, with the platform values on top (constitution XI). Never a secret.'
      additionalProperties: false
      required:
        - freshness
        - syncLevel
        - holdoutShare
        - decisionPolicy
        - commercialPolicy
        - evidenceProfile
        - surfaces
        - barriers
        - syncStrategy
        - locales
        - platform
      properties:
        freshness:
          $ref: '#/components/schemas/Freshness'
        syncLevel:
          $ref: '#/components/schemas/SyncLevelRules'
        holdoutShare:
          type: number
          description: Share of the traffic kept out of every experiment, as a fraction of 1; a merchant may set it to 0.
          minimum: 0
          maximum: 1
        decisionPolicy:
          $ref: '#/components/schemas/DecisionPolicy'
        commercialPolicy:
          $ref: '#/components/schemas/CommercialPolicy'
        evidenceProfile:
          $ref: '#/components/schemas/EvidenceProfile'
        surfaces:
          type: array
          description: Page types where OPE may intervene.
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Surface'
        barriers:
          type: array
          description: Barriers OPE may infer for the merchant; the others are never dominant.
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Barrier'
        syncStrategy:
          $ref: '#/components/schemas/SyncStrategy'
        locales:
          $ref: '#/components/schemas/Locales'
        attributeLabels:
          type: array
          description: What the merchant's own attribute labels correspond to in OPE's vocabulary; several labels may point at one value, one label at one only.
          maxItems: 256
          items:
            $ref: '#/components/schemas/AttributeLabel'
        anchors:
          $ref: '#/components/schemas/AnchorMap'
        platform:
          $ref: '#/components/schemas/PlatformConfiguration'
    FreshnessDeclared:
      type: object
      description: The freshness budgets a merchant declares; an absent one resolves from the treatment defaults.
      additionalProperties: false
      properties:
        catalogMs:
          type: integer
          description: Milliseconds since `capturedAt` beyond which the snapshot holds no truth at all.
          minimum: 1
          maximum: 31536000000
        stockAndPriceMs:
          type: integer
          description: Milliseconds since `capturedAt` beyond which availability and price no longer sustain a claim.
          minimum: 1
          maximum: 31536000000
    SyncLevelRulesDeclared:
      type: object
      description: The synchronisation level thresholds a merchant declares; an absent one resolves from the treatment defaults.
      additionalProperties: false
      properties:
        receiptsKept:
          type: integer
          description: Snapshot receipts kept per merchant to judge the cadence.
          minimum: 2
          maximum: 1000000
        noDataAfterMs:
          type: integer
          description: Age of the latest receipt beyond which the level is 0.
          minimum: 1
          maximum: 31536000000
        minutesLevelMaxAgeMs:
          type: integer
          description: Age of the latest receipt beyond which the level cannot be 2.
          minimum: 1
          maximum: 31536000000
        minutesLevelMedianIntervalMs:
          type: integer
          description: Median interval between receipts at or under which the level is 2.
          minimum: 1
          maximum: 31536000000
        minutesLevelMinReceipts:
          type: integer
          description: Least receipts to judge a cadence of minutes.
          minimum: 2
          maximum: 1000000
    DecisionPolicyDeclared:
      type: object
      description: 'What a merchant declares of its decision policy: the version and any field; the rest resolves from the treatment defaults.'
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: string
          description: Version the merchant gives its decision policy; stamped in every decision.
          minLength: 1
          maxLength: 64
        rules:
          type: array
          description: The rules, at least one per active barrier.
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/BarrierRule'
        weights:
          $ref: '#/components/schemas/PolicyWeights'
        readingSeconds:
          type: number
          description: Seconds of dwell a `dwellSeconds` condition without `min` asks for.
          minimum: 0
          maximum: 3600
        threshold:
          type: number
          description: Confidence a barrier must reach to be inferred, 0..1.
          minimum: 0
          maximum: 1
        priority:
          type: array
          description: The three barriers in tie-break order (a permutation).
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Barrier'
        evidence:
          $ref: '#/components/schemas/PolicyEvidence'
    CommercialPolicyDeclared:
      type: object
      description: 'What a merchant declares of its commercial policy: the version and any field; the rest resolves from the treatment defaults.'
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: string
          description: Version the merchant gives its commercial policy; stamped in every decision.
          minLength: 1
          maxLength: 64
        maxIncentiveShare:
          type: number
          description: Ceiling of any incentive, as a fraction of 1.
          minimum: 0
          maximum: 1
        incentiveLadderShare:
          type: array
          description: Incentive steps as fractions of 1, strictly increasing, within the ceiling.
          minItems: 1
          maxItems: 8
          items:
            type: number
            description: One step.
            minimum: 0
            maximum: 1
        marginShare:
          type: number
          description: Margin the merchant declares, as a fraction of 1; absent means no incentive goes out (01 §4.7).
          minimum: 0
          maximum: 1
        directIncentiveOnPrice:
          type: boolean
          description: Whether the price barrier may receive the incentive directly.
        returnRisk:
          $ref: '#/components/schemas/Condition'
        highIntent:
          type: string
          description: From which step a visitor counts as high intent, where OPE keeps quiet.
          enum:
            - from-cart
            - from-checkout
            - never
        abandonment:
          type: string
          description: What a cart abandonment without a signal triggers.
          enum:
            - nothing
            - reassure-returns
        interventionsPerSession:
          type: integer
          description: Interventions a session may receive.
          minimum: 1
          maximum: 1000000
        cooldownSeconds:
          type: integer
          description: Seconds between two interventions of a session.
          minimum: 0
          maximum: 86400
        interventionsPerVisitorPerDay:
          type: integer
          description: Interventions a visitor may receive per day (fatigue).
          minimum: 1
          maximum: 1000000
    EvidenceProfileDeclared:
      type: object
      description: What a merchant declares of its evidence profile; an absent field resolves from the treatment defaults.
      additionalProperties: false
      properties:
        returnsPolicy:
          type: boolean
          description: Whether the merchant has a returns policy OPE may cite.
        fitData:
          type: boolean
          description: Whether the merchant provides fit data OPE may recommend a size with.
        authorizedAttributes:
          type: array
          description: Product attributes the messages may name.
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            maxLength: 64
    SyncStrategyDeclared:
      type: object
      description: The modes a merchant declares per flow; an absent flow resolves from the treatment defaults.
      additionalProperties: false
      properties:
        catalog:
          $ref: '#/components/schemas/SyncMode'
        stockAndPrice:
          $ref: '#/components/schemas/SyncMode'
        orders:
          $ref: '#/components/schemas/SyncMode'
        returns:
          $ref: '#/components/schemas/SyncMode'
    MerchantConfigurationDeclared:
      type: object
      description: 'Level 3: what a merchant overrides of the treatment defaults, plus its anchor map (which has no default). Every field is optional; a declared policy names its version and may declare only some of its fields.'
      additionalProperties: false
      x-invariants:
        - type: duplicate-attribute-label
          status: 422
          rule: attributeLabels[].label are unique
          description: One label of the merchant pointing at two values of OPE's vocabulary; there would be no way to tell what a product carrying it says.
      properties:
        freshness:
          $ref: '#/components/schemas/FreshnessDeclared'
        syncLevel:
          $ref: '#/components/schemas/SyncLevelRulesDeclared'
        holdoutShare:
          type: number
          description: Share of the traffic kept out of every experiment, as a fraction of 1; a merchant may set it to 0.
          minimum: 0
          maximum: 1
        decisionPolicy:
          $ref: '#/components/schemas/DecisionPolicyDeclared'
        commercialPolicy:
          $ref: '#/components/schemas/CommercialPolicyDeclared'
        evidenceProfile:
          $ref: '#/components/schemas/EvidenceProfileDeclared'
        surfaces:
          type: array
          description: Page types where OPE may intervene.
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Surface'
        barriers:
          type: array
          description: 'Barriers OPE may infer for the merchant; the others are never dominant. No upper bound of its own: with unique items over a closed vocabulary the list cannot exceed it, and a number here would say «a merchant picks at most N» while meaning «N exist» — two things that stop coinciding the day one more barrier exists.'
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Barrier'
        syncStrategy:
          $ref: '#/components/schemas/SyncStrategyDeclared'
        locales:
          $ref: '#/components/schemas/Locales'
        attributeLabels:
          type: array
          description: What the merchant's own attribute labels correspond to in OPE's vocabulary; several labels may point at one value, one label at one only.
          maxItems: 256
          items:
            $ref: '#/components/schemas/AttributeLabel'
        anchors:
          $ref: '#/components/schemas/AnchorMap'
    MerchantConfiguration:
      type: object
      description: 'The configuration of a merchant as it is served: the effective values, what it declared in the version in force, and the three versions.'
      additionalProperties: false
      required:
        - effective
        - declared
        - versions
      properties:
        effective:
          $ref: '#/components/schemas/EffectiveConfiguration'
        declared:
          $ref: '#/components/schemas/MerchantConfigurationDeclared'
        versions:
          $ref: '#/components/schemas/ConfigurationVersions'
    MerchantConfigurationInput:
      type: object
      description: 'What an operator publishes: the declared values of the new version, whether it is corrective (allowed while an experiment is active, with a reason) and why.'
      additionalProperties: false
      required:
        - declared
      properties:
        declared:
          $ref: '#/components/schemas/MerchantConfigurationDeclared'
        corrective:
          type: boolean
          description: 'A corrective version: the only kind allowed while an experiment is active; it restarts the experiment''s measurement window (03 §4.10).'
        reason:
          type: string
          description: Why the version is published; required when corrective.
          minLength: 1
          maxLength: 512
      x-invariants:
        - type: configuration-reason-required
          status: 422
          rule: a corrective version carries a reason
          pointer: reason
          description: A corrective change while an experiment runs must be explained in the log (03 §4.10).
        - type: invalid-configuration-value
          status: 422
          rule: every declared value satisfies the invariants of its type (rates 0..1, increasing ladder, ceiling at or above the steps, language tags by shape, closed vocabularies) once resolved over the treatment defaults
          description: 'Nothing invalid becomes a version: the pointer names the field (constitution XI, FR-014).'
    ExperimentId:
      type: string
      description: Identifier of an experiment, minted by OPE when the operator opens it.
      pattern: ^[A-Za-z0-9_-]{8,64}$
    MerchantConfigurationVersion:
      type: object
      description: 'A published version of a merchant''s configuration (01 §14.2): numbered, immutable, with who published it and why.'
      additionalProperties: false
      required:
        - version
        - declared
        - corrective
        - publishedAt
        - operatorId
      properties:
        version:
          type: integer
          description: Sequential number per merchant, assigned at publication.
          minimum: 1
        declared:
          $ref: '#/components/schemas/MerchantConfigurationDeclared'
        corrective:
          type: boolean
          description: Whether the version was published as corrective.
        reason:
          type: string
          description: The reason the operator declared, when any.
          maxLength: 512
        publishedAt:
          type: string
          format: date-time
          description: Instant of publication.
        operatorId:
          $ref: '#/components/schemas/OperatorId'
        windowsRestarted:
          type: array
          description: 'The experiment whose measurement window this version restarted, when it was corrective: the active one of this merchant, if the change reached it. Every reading of the version returns it: its publication, a repetition of the same body, the history and the version by number. A version published before its restarts were recorded (feature 036; 038 for texts) carries none.'
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ExperimentId'
    MerchantConfigurationVersionPage:
      type: object
      description: A page of a merchant's configuration versions, newest first.
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: Versions of this page, newest first.
          items:
            $ref: '#/components/schemas/MerchantConfigurationVersion'
        nextCursor:
          type: string
          description: Cursor of the next page; absent on the last page.
          maxLength: 512
    ExperimentStatus:
      type: string
      description: 'The state of an experiment (03 §4.10, D-G): `calibrating` — visitors are assigned and OPE decides, every decision is marked as calibration and counts for nothing, the configuration still moves; `active` — the accumulation window runs and the configuration is frozen (only a corrective version enters, restarting the window); `closed` — terminal: nobody new is assigned, what was recorded stays.'
      enum:
        - calibrating
        - active
        - closed
    ConfigurationLevel:
      type: string
      description: 'Which of the three levels of the configuration a version belongs to (constitution XI): `platform` and `defaults` are the two of the release, published by an operator since feature 036; `merchant` is what a merchant overrides.'
      enum:
        - platform
        - defaults
        - merchant
    MessageFamily:
      type: string
      description: 'A message family of OPE''s closed vocabulary, `<barrier>.<anchor>.<step>`: the candidate the decision plane may show, and what a text is keyed by (ADR-027). Never created through the API.'
      pattern: ^[a-z]+\.[a-z_]+\.[a-z_]+$
      minLength: 5
      maxLength: 64
      example: fit.variant_selector.information
    WindowRestart:
      type: object
      description: |-
        A restart of the accumulation window (03 §4.10, D-G): a corrective configuration version published while the experiment was active.

        **It says which level the version belongs to** (feature 036). With only the merchant publishing, a number identified a version; with three levels publishing, «version 3» could be the third of the merchant, of the treatment defaults or of the platform.

        **And which text, when a text caused it** (feature 038): a version of a text is treatment too, and it restarts the window the same way.
      additionalProperties: false
      required:
        - at
        - reason
        - level
        - configurationVersion
      properties:
        at:
          type: string
          format: date-time
          description: When the window restarted.
        reason:
          type: string
          description: The reason the operator declared with the corrective version.
          maxLength: 512
        level:
          $ref: '#/components/schemas/ConfigurationLevel'
        configurationVersion:
          type: integer
          description: The corrective version that restarted the window, of the level named above.
          minimum: 1
        text:
          type: object
          description: 'The text whose version caused the restart (feature 038): its key and its layer. Then `configurationVersion` is the version of that key in that layer, and `level` stands where the layer would — `defaults` for the base, `merchant` for the merchant''s own. Absent when a configuration version caused the restart.'
          additionalProperties: false
          required:
            - family
            - locale
            - layer
          properties:
            family:
              $ref: '#/components/schemas/MessageFamily'
            attributeValue:
              $ref: '#/components/schemas/AttributeValue'
            locale:
              type: string
              description: The language of the text, as a BCP 47 tag.
              pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
              maxLength: 35
            layer:
              type: string
              description: 'Whose layer the version belongs to: `base`, or the identifier of the merchant.'
              minLength: 1
              maxLength: 64
    Experiment:
      type: object
      description: 'An experiment of a merchant as the administration reads it (ADR-022, D-G): its state and instants; never the seed.'
      additionalProperties: false
      required:
        - experimentId
        - status
        - treatmentShare
        - targetSample
        - cuts
        - openedAt
        - windowRestarts
      properties:
        experimentId:
          $ref: '#/components/schemas/ExperimentId'
        status:
          $ref: '#/components/schemas/ExperimentStatus'
        treatmentShare:
          type: number
          description: Share of visitors assigned to TREATMENT, as a fraction of 1. The assignment resolves to whole buckets of one hundredth, so a finer value takes the nearest bucket.
          minimum: 0
          maximum: 1
        targetSample:
          type: integer
          description: Visitors the accumulation window aims at.
          minimum: 1
        cuts:
          type: array
          description: Interim cuts as fractions of the target sample, strictly increasing; empty when the target sample is the only cut.
          items:
            type: number
            exclusiveMinimum: 0
            maximum: 1
        openedAt:
          type: string
          format: date-time
          description: When the experiment was opened (calibration starts).
        activatedAt:
          type: string
          format: date-time
          description: When it was activated; absent while calibrating or when closed from calibration.
        windowStartedAt:
          type: string
          format: date-time
          description: Start of the accumulation window in force — the activation or the last restart; absent while calibrating.
        closedAt:
          type: string
          format: date-time
          description: When it was closed; absent while open.
        windowRestarts:
          type: array
          description: Every restart of the accumulation window, oldest first.
          items:
            $ref: '#/components/schemas/WindowRestart'
    ExperimentPage:
      type: object
      description: A page of a merchant's experiments, newest first.
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: Experiments of this page, newest first.
          items:
            $ref: '#/components/schemas/Experiment'
        nextCursor:
          type: string
          description: Cursor of the next page; absent on the last page.
          maxLength: 512
    ExperimentCreate:
      type: object
      description: 'What an operator declares to open an experiment (ADR-022, D-G): the split, the seed of the assignment key, the target sample and the cuts at which its result may be read (D-F). Split and seed are immutable: changing them is another experiment.'
      additionalProperties: false
      required:
        - treatmentShare
        - seed
        - targetSample
      properties:
        treatmentShare:
          type: number
          description: 'Share of the merchant''s visitors assigned to TREATMENT, as a fraction of 1; the rest is CONTROL. It cannot exceed what the holdout of the merchant leaves (`1 − holdoutShare`). The assignment splits the visitors into whole buckets of one hundredth, so the share has to be one of them: `0.07` is a share, `0.075` is not.'
          minimum: 0
          maximum: 1
        seed:
          type: string
          description: Part of the assignment key; never shown again.
          minLength: 1
          maxLength: 128
        targetSample:
          type: integer
          description: Visitors the accumulation window aims at; the last cut.
          minimum: 1
        cuts:
          type: array
          description: 'Interim cuts as fractions of the target sample, strictly increasing (D-F: results are read only at pre-fixed cuts). Without cuts, the target sample is the only one.'
          maxItems: 10
          items:
            type: number
            exclusiveMinimum: 0
            maximum: 1
      x-invariants:
        - type: invalid-experiment-cuts
          status: 422
          rule: the cuts are strictly increasing fractions
          description: A cut that does not follow the previous one is a mistake, not an order (D-F).
        - type: treatment-share-too-fine
          status: 422
          rule: treatmentShare is one of the buckets the assignment splits the visitors into
          description: 'A finer share would be rounded to the nearest bucket without saying so, and the split that ran would not be the one that was declared: `0.004` would assign nobody (ADR-035).'
    AnchorDiagnostic:
      type: object
      description: 'An unresolved anchor as the administration reads it (01 §3.1.1): the last time the SDK reported it and how many times, per anchor, page type and configuration version.'
      additionalProperties: false
      required:
        - anchor
        - pageType
        - lastSeenAt
        - count
      properties:
        anchor:
          $ref: '#/components/schemas/Anchor'
        pageType:
          $ref: '#/components/schemas/PageType'
        configurationVersion:
          type: integer
          description: The configuration version the SDK had loaded when it reported; absent when it did not say.
          minimum: 1
        lastSeenAt:
          type: string
          format: date-time
          description: The last report.
        count:
          type: integer
          description: Reports received for this key.
          minimum: 1
    AnchorDiagnosticPage:
      type: object
      description: A page of anchor diagnostics of a merchant, most recent first.
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: Diagnostics of this page, most recent first.
          items:
            $ref: '#/components/schemas/AnchorDiagnostic'
        nextCursor:
          type: string
          description: Cursor of the next page; absent on the last page.
          maxLength: 512
    UnmappedAttributeValue:
      type: object
      description: 'An attribute label of the merchant''s catalogue with no correspondence in the closed vocabulary of the platform: how many products of the catalogue carry it, since when it has been arriving and when it last arrived. While it is listed, those products say nothing about that attribute; mapping it makes them speak and takes it off this list.'
      additionalProperties: false
      required:
        - label
        - products
        - firstSeenAt
        - lastSeenAt
      properties:
        label:
          type: string
          description: The label as the platform of the merchant exposes it, not normalised.
          minLength: 1
          maxLength: 512
        products:
          type: integer
          description: Products of the last catalogue that carry this label.
          minimum: 1
        firstSeenAt:
          type: string
          format: date-time
          description: The first catalogue this label arrived in without a correspondence.
        lastSeenAt:
          type: string
          format: date-time
          description: The last catalogue it arrived in.
    UnmappedAttributeValuePage:
      type: object
      description: A page of unmapped attribute labels of a merchant, most recent first.
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: Unmapped labels of this page, most recent first.
          items:
            $ref: '#/components/schemas/UnmappedAttributeValue'
        nextCursor:
          type: string
          description: Cursor of the next page; absent on the last page.
          maxLength: 512
    PlatformConfigurationContent:
      type: object
      description: |-
        The values of level 1 (constitution XI), without the version that names them: what an operator publishes. The version is **minted by OPE** from the position in the level's history (`platform-3`), so nothing here declares one — until feature 036 the release file carried a version of its own and nothing forced anyone to change it when the content did.

        It is not an `allOf` of `PlatformConfiguration` minus a field, for the same reason as `TreatmentDefaultsContent`: `additionalProperties: false` does not compose through `allOf`.
      additionalProperties: false
      required:
        - dedupWindow
        - eventPastToleranceMs
        - clockSkewToleranceMs
        - sessionDurationMs
        - visitorWindowMs
        - signatureWindowMs
        - rotationGraceMaxMs
        - anchorDiagnosticsKept
        - unmappedValuesKept
        - retryAfterSeconds
      properties:
        dedupWindow:
          $ref: '#/components/schemas/DedupWindow'
        eventPastToleranceMs:
          type: integer
          description: Milliseconds an event instant may sit in the past (late uploads).
          minimum: 1
          maximum: 31536000000
        clockSkewToleranceMs:
          type: integer
          description: Milliseconds an instant a client declares may sit in the future.
          minimum: 0
          maximum: 31536000000
        sessionDurationMs:
          type: integer
          description: Milliseconds of inactivity after which a session is over and the SDK must mint a new `sessionId`. It is a rule of the backend that the SDK obeys, not an observation the client makes (feature 032).
          minimum: 1
          maximum: 31536000000
        visitorWindowMs:
          type: integer
          description: Milliseconds a visitor's interventions count for the fatigue limit.
          minimum: 1
          maximum: 31536000000
        signatureWindowMs:
          type: integer
          description: Milliseconds a platform signature's timestamp may sit from the server clock, either way (ADR-029).
          minimum: 1
          maximum: 31536000000
        rotationGraceMaxMs:
          type: integer
          description: Longest grace a credential rotation may give the previous credential.
          minimum: 0
          maximum: 31536000000
        anchorDiagnosticsKept:
          type: integer
          description: Anchor diagnostics kept per merchant at most.
          minimum: 1
          maximum: 1000000
        unmappedValuesKept:
          type: integer
          description: Unmapped attribute labels kept per merchant at most; past it the oldest is dropped and the catalogue is never refused.
          minimum: 1
          maximum: 1000000
        retryAfterSeconds:
          type: integer
          description: 'Seconds a client waits before retrying a write a store could not accept: the `Retry-After` of every 503 (ADR-021).'
          minimum: 1
          maximum: 3600
    PlatformConfigurationInput:
      type: object
      description: |-
        What an operator publishes as the next version of level 1: the values, whether the version is corrective and why.

        Level 1 is the same for every merchant, so a change reaches every one of them. Four of its values decide **what is counted** — the deduplication window, the two clock tolerances and how long a session lasts — so while an experiment they reach is active only a corrective version is accepted, and it restarts the measurement window of each one (ADR-031 as amended by feature 036).
      additionalProperties: false
      required:
        - content
      properties:
        content:
          $ref: '#/components/schemas/PlatformConfigurationContent'
        corrective:
          type: boolean
          description: 'A corrective version: the only kind accepted while an experiment this change reaches is active; it restarts the measurement window of each one.'
        reason:
          type: string
          description: Why the version is published; required when corrective.
          minLength: 1
          maxLength: 512
      x-invariants:
        - type: configuration-reason-required
          status: 422
          rule: a corrective version carries a reason
          pointer: reason
          description: A change of level 1 reaches every merchant, so a corrective one while measurements run must be explained in the log (03 §4.10).
        - type: invalid-configuration-value
          status: 422
          rule: every published value satisfies the invariants of its type (windows and tolerances within their range, retention above zero)
          description: 'Nothing invalid becomes a version: the pointer names the field (constitution XI).'
    PlatformConfigurationVersion:
      type: object
      description: 'A published version of level 1: numbered, immutable, with who published it and why. The `stampedAs` is what every decision stamps and what the SDK receives, and it is minted from the number.'
      additionalProperties: false
      required:
        - version
        - stampedAs
        - content
        - corrective
        - publishedAt
        - operatorId
      properties:
        version:
          type: integer
          description: Sequential number of the level, assigned at publication.
          minimum: 1
        stampedAs:
          type: string
          description: 'What the version is called wherever the level is quoted (`platform-3`): minted from the number, never declared.'
          minLength: 1
          maxLength: 64
        content:
          $ref: '#/components/schemas/PlatformConfigurationContent'
        corrective:
          type: boolean
          description: Whether the version was published as corrective.
        reason:
          type: string
          description: The reason the operator declared, when any.
          maxLength: 512
        publishedAt:
          type: string
          format: date-time
          description: Instant of publication.
        operatorId:
          $ref: '#/components/schemas/OperatorId'
        windowsRestarted:
          type: array
          description: 'The experiments whose measurement window this version restarted, when it was corrective: the ones that resolve from this level for something it changed. Every reading of the version returns it: its publication, a repetition of the same body, the history and the version by number. A version published before its restarts were recorded (feature 036; 038 for texts) carries none.'
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ExperimentId'
    PlatformConfigurationVersionPage:
      type: object
      description: A page of the published versions of level 1, newest first.
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: Versions of this page, newest first.
          items:
            $ref: '#/components/schemas/PlatformConfigurationVersion'
        nextCursor:
          type: string
          description: Cursor of the next page; absent on the last page.
          maxLength: 512
