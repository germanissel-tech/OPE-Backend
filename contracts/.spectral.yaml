# Ruleset of the OPE contract. Every custom rule (ope-*) is `error`: it fails the build.
# Maintenance notes (specs/001-api-contract-toolchain/research.md, R-02):
# - Block style, not flow (`then: { field: x }` breaks the ruleset loader).
# - "off" in quotes (YAML reads `off` as false).
# - oas3-schema is off: it fails with external path item $refs in OpenAPI 3.1; structural
#   validity is guaranteed by `redocly lint` (scripts/contract-lint.mjs).
extends:
  - "spectral:oas"
functionsDir: ./rules/functions
functions:
  - noPii
  - noMerchantIdInRequest
  - requestClosedSchema
  - hasExample
  - requiredErrorResponses
  - pathVersionPrefix
  - problemDetailsErrorResponse
  - invariants
  - noGeneric422
  - requiredCapabilities
  - consumerSecurity
  - outcomesIdempotency
  - platformSignatureHeaders
  - collectionPagination
rules:
  oas3-schema: "off"
  # Inherited from spectral:oas, raised to error (FR-012, FR-004, FR-014).
  operation-operationId: error
  operation-operationId-unique: error
  operation-operationId-valid-in-url: error
  operation-description: error
  operation-tags: error
  operation-tag-defined: error
  oas3-unused-component: error
  oas3-valid-media-example: error
  oas3-valid-schema-example: error
  no-$ref-siblings: error
  path-params: error
  duplicated-entry-in-enum: error

  # FR-012: camelCase operationId.
  ope-operation-id-camel-case:
    description: operationId in camelCase (getHealth, ingestEvent).
    message: "operationId '{{value}}' is not camelCase. Rename it as verbNoun (for example getHealth)."
    severity: error
    given: "$.paths[*][get,put,post,delete,patch,options,head,trace].operationId"
    then:
      function: casing
      functionOptions:
        type: camel

  # FR-012: summary is mandatory.
  ope-operation-summary:
    description: Every operation carries a summary.
    message: "Missing summary at {{path}}. Add one line describing the operation."
    severity: error
    given: "$.paths[*][get,put,post,delete,patch,options,head,trace]"
    then:
      field: summary
      function: truthy

  # FR-004: exactly one tag per operation.
  ope-operation-single-tag:
    description: Each operation uses exactly one tag.
    message: "The operation must have exactly one tag ({{path}}). Keep a single one from the catalogue."
    severity: error
    given: "$.paths[*][get,put,post,delete,patch,options,head,trace].tags"
    then:
      function: length
      functionOptions:
        min: 1
        max: 1

  # FR-004: closed catalogue of tags.
  ope-tags-closed-catalog:
    description: Tags belong to the contract's closed catalogue.
    message: "Tag '{{value}}' is outside the catalogue (system, ingest, decision, outcomes, portal, admin). Use one from the catalogue; extending it is a scope change."
    severity: error
    given:
      - "$.tags[*].name"
      - "$.paths[*][get,put,post,delete,patch,options,head,trace].tags[*]"
    then:
      function: enumeration
      functionOptions:
        values:
          - system
          - ingest
          - decision
          - outcomes
          - portal
          - admin

  # FR-013: every schema property has a description.
  ope-property-description:
    description: Every schema property carries a description.
    message: "Property {{property}} has no description ({{path}}). Add a description of what it is and where it comes from."
    severity: error
    given: "$..properties[*]"
    then:
      field: description
      function: truthy

  # FR-014: an example in every request body.
  ope-request-example:
    description: Every request body carries an example.
    message: "{{error}}"
    severity: error
    given: "$.paths[*][get,put,post,delete,patch,options,head,trace].requestBody.content[*]"
    then:
      function: hasExample

  # FR-014: an example in every 2xx response with a body.
  ope-success-response-example:
    description: Every 2xx response with content carries an example.
    message: "{{error}}"
    severity: error
    given: "$.paths[*][get,put,post,delete,patch,options,head,trace].responses[?(@property.match(/^2\\d\\d$/))].content[*]"
    then:
      function: hasExample

  # FR-015: closed request bodies (recursive).
  ope-request-closed-schema:
    description: Every object of a request body declares additionalProperties false.
    message: "{{error}}"
    severity: error
    given: "$.paths[*][get,put,post,delete,patch,options,head,trace].requestBody.content[*].schema"
    then:
      function: requestClosedSchema

  # FR-016: denylist of personal data.
  ope-no-pii:
    description: No property, parameter or header name is in contracts/rules/pii-denylist.json.
    message: "{{error}}"
    severity: error
    given: "$"
    then:
      function: noPii
      functionOptions:
        denylist: ./rules/pii-denylist.json

  # FR-017: merchantId never comes in through the request.
  ope-no-merchant-id-in-request:
    description: merchantId is derived from the credential; it is never a parameter or a request field.
    message: "{{error}}"
    severity: error
    given: "$"
    then:
      function: noMerchantIdInRequest
      functionOptions:
        map: ./api-map.yaml

  # FR-018: errors as Problem Details.
  ope-error-response-problem-details:
    description: Every 4xx/5xx response is application/problem+json with ProblemDetails.
    message: "{{error}}"
    severity: error
    given: "$.paths[*][get,put,post,delete,patch,options,head,trace].responses[?(@property.match(/^[45]\\d\\d$/))]"
    then:
      function: problemDetailsErrorResponse

  # FR-019: mandatory error responses.
  ope-required-error-responses:
    description: 500 always; 401 if authenticated; 400 if it has a request body; 422 if the body or the operation declares an invariant.
    message: "{{error}}"
    severity: error
    given: "$.paths[*][get,put,post,delete,patch,options,head,trace]"
    then:
      function: requiredErrorResponses

  # FR-003: /v{major} prefix tied to info.version.
  ope-path-version-prefix:
    description: Every path carries the /v{major} prefix of info.version.
    message: "{{error}}"
    severity: error
    given: "$"
    then:
      function: pathVersionPrefix

  # FR-001/FR-002 (ADR-007): declared invariants are complete and typed from the catalogue.
  ope-invariants:
    description: Every x-invariants entry has type (from the catalogue), a consistent status, rule and description.
    message: "{{error}}"
    severity: error
    given: "$"
    then:
      function: invariants
      functionOptions:
        catalog: ./problem-types.yaml

  # FR-004 (ADR-001): no generic 422; each 422 names its invariant.
  ope-no-generic-422:
    description: Every 422 response documents the invariant that produces it, never the generic type.
    message: "{{error}}"
    severity: error
    given: "$.paths[*][get,put,post,delete,patch,options,head,trace]"
    then:
      function: noGeneric422
      functionOptions:
        catalog: ./problem-types.yaml

  # FR-031: required capability on authenticated operations.
  ope-required-capabilities:
    description: Authenticated operation ⇒ non-empty x-required-capabilities; public ⇒ without it.
    message: "{{error}}"
    severity: error
    given: "$.paths[*][get,put,post,delete,patch,options,head,trace]"
    then:
      function: requiredCapabilities
      functionOptions:
        map: ./api-map.yaml

  # FR-012 of feature 006 (ADR-020): the tag fixes the consumer; the consumer fixes the scheme.
  ope-consumer-security:
    description: Public operations declare security []; the rest, exactly the scheme of their consumer.
    message: "{{error}}"
    severity: error
    given: "$.paths[*][get,put,post,delete,patch,options,head,trace]"
    then:
      function: consumerSecurity
      functionOptions:
        map: ./api-map.yaml

  # FR-021 of feature 006 (ADR-020): server-to-server notifications are idempotent by contract.
  ope-platform-signature-headers:
    description: Every operation secured with platformKey declares the X-OPE-Timestamp and X-OPE-Signature header parameters (ADR-029).
    message: "{{error}}"
    severity: error
    given: "$.paths[*][get,put,post,delete,patch,options,head,trace]"
    then:
      function: platformSignatureHeaders
  ope-outcomes-idempotency:
    description: Every outcomes operation declares x-idempotency (key, first, repeat) and a 409.
    message: "{{error}}"
    severity: error
    given: "$.paths[*][get,put,post,delete,patch,options,head,trace]"
    then:
      function: outcomesIdempotency

  # FR-031 of feature 006 (ADR-020): portal collections paginate the same way.
  ope-collection-pagination:
    description: A GET of a portal collection declares x-collection, the common parameters and a <X>Page.
    message: "{{error}}"
    severity: error
    # Unresolved: the rule checks that the parameters and the page are shared by $ref.
    resolved: false
    given: "$.paths[*]"
    then:
      function: collectionPagination
