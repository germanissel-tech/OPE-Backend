post:
  operationId: publishTreatmentDefaults
  tags:
    - admin
  security:
    - adminToken: []
  x-required-capabilities:
    - configuration:write
  x-idempotency:
    key: content
    first: "201"
    repeat: "200"
  summary: Publish a version of the treatment defaults
  description: "Creates the next version of level 2 (constitution XI; ADR-031 as amended by feature 036):
    numbered, immutable, effective on the next request without a restart. Until then these values changed
    only with a deploy, which contaminates any measurement in course the same way without leaving a
    version, an entry in the log or a restarted window.


    A body identical to the version in force repeats it (`200`) instead of creating one. The change
    **reaches** every merchant that does not override one of the leaves it changes: while an experiment it
    reaches is active only a corrective version — with its reason — is accepted (`409
    configuration-frozen`), and it restarts the measurement window of each one. An invalid value is
    refused naming the field and no version is created. It takes an operator over every merchant, because
    the change reaches them all."
  parameters:
    - $ref: ../components/parameters/If-Match.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/TreatmentDefaultsInput.yaml
        example:
          content: &content
            freshness:
              catalogMs: 129600000
              stockAndPriceMs: 900000
            syncLevel:
              receiptsKept: 8
              noDataAfterMs: 129600000
              minutesLevelMaxAgeMs: 3600000
              minutesLevelMedianIntervalMs: 900000
              minutesLevelMinReceipts: 3
            holdoutShare: 0.1
            decisionPolicy:
              version: default-1
              rules:
                - id: price.price-read
                  barrier: price
                  strength: strong
                  when:
                    fact: dwellSeconds
                    block: price
              weights:
                strong: 0.4
                supporting: 0.2
              readingSeconds: 5
              threshold: 0.6
              priority:
                - returns
                - fit
                - price
              evidence:
                freshStockAndPrice:
                  - price
                availableVariant:
                  - fit
            commercialPolicy:
              version: commercial-default-1
              maxIncentiveShare: 0.1
              incentiveLadderShare:
                - 5
                - 10
              directIncentiveOnPrice: true
              returnRisk:
                all:
                  - fact: eventCount
                    type: variant_selector_interacted
                    min: 2
                  - fact: dwellSeconds
                    block: policies
              highIntent: from-checkout
              abandonment: reassure-returns
              interventionsPerSession: 1
              cooldownSeconds: 0
              interventionsPerVisitorPerDay: 3
            evidenceProfile:
              returnsPolicy: false
              fitData: false
              authorizedAttributes: []
            surfaces:
              - product
              - cart
            barriers:
              - fit
              - price
              - returns
            syncStrategy:
              catalog: push
              stockAndPrice: push
              orders: push
              returns: push
            platformSource: generic
            confirmedOrderStates: []
            syncCadence:
              catalogMs: 86400000
              stockAndPriceMs: 60000
              stockAndPriceBatchSize: 200
              ordersMs: 120000
              returnsMs: 900000
            noticeRetry:
              afterMs: 60000
              maxAttempts: 10
            locales:
              supported: []
          corrective: true
          reason: holdout raised to 10% before the pilot
  responses:
    "200":
      description: The version in force, identical to what was published.
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TreatmentDefaultsVersion.yaml
          example: &version
            version: 3
            stampedAs: defaults-3
            content: *content
            corrective: true
            reason: holdout raised to 10% before the pilot
            publishedAt: 2026-10-01T12:00:00Z
            operatorId: ops-1
            windowsRestarted:
              - exp_a_000001
    "201":
      description: The version created.
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TreatmentDefaultsVersion.yaml
          example: *version
    "400":
      $ref: ../components/responses/BadRequest.yaml
    "401":
      $ref: ../components/responses/OperatorUnauthorized.yaml
    "403":
      $ref: ../components/responses/PlatformWideForbidden.yaml
    "409":
      $ref: ../components/responses/ConfigurationFrozenConflict.yaml
    "422":
      $ref: ../components/responses/TreatmentDefaultsUnprocessable.yaml
    "412":
      $ref: ../components/responses/StaleVersion.yaml
    "428":
      $ref: ../components/responses/WitnessRequired.yaml
    "500":
      $ref: ../components/responses/InternalServerError.yaml
    "503":
      $ref: ../components/responses/ServiceUnavailable.yaml
  x-invariants:
    - type: stale-version
      status: 412
      rule: the witness in If-Match is the current witness of the treatment defaults, unless the body is identical to what is in force
      description:
        "The write replaces the treatment defaults whole with what the caller read and changed (ADR-046), so a write in between
        would be undone without anybody knowing. It is judged after the scope of the operator and after the
        repetition of an identical body —which answers as before, with any witness, so the retry of a write
        that went through does not fail— and before anything else, the freeze included. A witness that is not
        this resource's never matches."
    - type: locale-incomplete
      status: 422
      rule: a language enters the supported list or becomes the reserve only when the base layer holds a text
        for every unconditional family in it
      description:
        "A merchant served in a language with no texts would be served nothing (feature 038, FR-010):
        the check is crossed against the texts published by API, not against the files of the release. Only
        the languages that **enter** are judged; one already there, or one that leaves, asks nothing. The
        details name the families that are missing, which is what completing the base needs. Judged over the content of this level."
get:
  operationId: getTreatmentDefaults
  tags:
    - admin
  security:
    - adminToken: []
  x-required-capabilities:
    - configuration:read
  summary: The treatment defaults in force
  description: "Level 2 of the configuration (constitution XI): what every merchant gets unless it
    declares otherwise, with the name of the version in force (`defaults-3`, minted from its number). The
    release file is the seed of version 1; from there on an operator publishes it."
  responses:
    "200":
      description: The treatment defaults.
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TreatmentDefaults.yaml
          example:
