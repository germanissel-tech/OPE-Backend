get:
  operationId: listAdminLog
  tags: [admin]
  security:
    - adminToken: []
  x-required-capabilities:
    - log:read
  x-collection: true
  summary: The admin log, newest first
  description: |
    Every administration action of the platform — accepted, rejected or denied — with its
    operator, instant, operation, merchant and result (ADR-031). Reading the log is not itself
    logged. Every operator reads the whole log: it is of the platform, and each entry names its
    merchant. Paginated with an opaque cursor (ADR-020).
  parameters:
    - $ref: ../components/parameters/cursor.yaml
    - $ref: ../components/parameters/limit.yaml
  responses:
    "200":
      description: A page of the log.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AdminEntryPage.yaml
          example:
            items:
              - at: "2026-09-20T12:00:05Z"
                operatorId: ops-1
                operation: setKillSwitch
                merchantId: mrc_7f3k5d2q4m6x
                outcome: accepted
              - at: "2026-09-20T12:00:00Z"
                operatorId: system
                operation: importMerchants
                merchantId: mrc_7f3k5d2q4m6x
                outcome: accepted
    "400":
      $ref: ../components/responses/BadRequest.yaml
    "401":
      $ref: ../components/responses/OperatorUnauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "500":
      $ref: ../components/responses/InternalServerError.yaml
