get:
  operationId: getHealth
  tags: [system]
  security: []
  summary: Service status
  description: |
    Returns the service status, the contract version it is running with and the timestamp of
    the response. Requires no authentication. Declares no parameters: any query parameter is
    rejected with `400`.
  responses:
    "200":
      description: The service is operational.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Health.yaml
          examples:
            ok:
              $ref: ../examples/health-ok.yaml
    "400":
      $ref: ../components/responses/BadRequest.yaml
    "500":
      $ref: ../components/responses/InternalServerError.yaml
