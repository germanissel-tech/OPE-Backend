get:
  operationId: getTextVersion
  tags:
    - admin
  security:
    - adminToken: []
  x-required-capabilities:
    - texts:read
  summary: One published version of a base text
  description: "A version of the key as it was published, by its number: what every intervention that stamped
    its identifier showed. Immutable, so what it answers today is what it answered the day it was created
    (feature 038)."
  parameters:
    - $ref: ../components/parameters/textFamily.yaml
    - $ref: ../components/parameters/textLocale.yaml
    - $ref: ../components/parameters/textVersion.yaml
    - $ref: ../components/parameters/textAttributeValue.yaml
  responses:
    "200":
      description: The version.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TextVersion.yaml
          example:
            family: fit.variant_selector.information
            locale: es
            layer: base
            version: 2
            messageVersionId: base/fit.variant_selector.information/-/es#2
            text: Sizes vary between brands; check the guide before choosing.
            removed: false
            corrective: true
            reason: wording
            publishedAt: 2026-10-04T12:00:00Z
            operatorId: ops-1
    "400":
      $ref: ../components/responses/BadRequest.yaml
    "401":
      $ref: ../components/responses/OperatorUnauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "404":
      $ref: ../components/responses/TextVersionNotFound.yaml
    "500":
      $ref: ../components/responses/InternalServerError.yaml
    "503":
      $ref: ../components/responses/ServiceUnavailable.yaml
