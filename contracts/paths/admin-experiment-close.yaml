post:
  operationId: closeExperiment
  tags:
    - admin
  security:
    - adminToken: []
  x-required-capabilities:
    - experiments:write
  summary: Close an experiment for good
  description: "Terminal (03 §4.10): from the next batch no visitor of the merchant is assigned and
    every decision resolves NO_OP `no-active-experiment`; what was recorded stays. From
    calibration or from activity alike; it cannot be reopened. Repeating it changes nothing
    (`200` again)."
  parameters:
    - $ref: ../components/parameters/merchantId.yaml
    - $ref: ../components/parameters/experimentId.yaml
  responses:
    "200":
      description: The experiment, closed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Experiment.yaml
          example:
            experimentId: exp_9a8b7c6d5e4f
            status: closed
            treatmentPercent: 50
            targetSample: 32000
            cuts:
              - 33
              - 66
            openedAt: 2026-09-20T12:00:00Z
            activatedAt: 2026-09-27T12:00:00Z
            windowStartedAt: 2026-09-27T12:00:00Z
            closedAt: 2026-11-15T12:00:00Z
            windowRestarts: []
    "400":
      $ref: ../components/responses/BadRequest.yaml
    "401":
      $ref: ../components/responses/OperatorUnauthorized.yaml
    "403":
      $ref: ../components/responses/MerchantForbidden.yaml
    "404":
      $ref: ../components/responses/ExperimentNotFound.yaml
    "500":
      $ref: ../components/responses/InternalServerError.yaml
    "503":
      $ref: ../components/responses/ServiceUnavailable.yaml
