post:
  operationId: ingestEvents
  tags: [ingest]
  security:
    - ingestKey: []
  x-required-capabilities:
    - events:write
  summary: Ingest a batch of SDK events
  description: |
    Receives a batch of behavioural events from **one** session, with the merchant identified by
    the ingest credential. Validates against the allow-list (any undeclared field rejects the
    whole batch with `400`), deduplicates by `eventId` within the merchant (window: 24 hours or
    100,000 events per merchant, whichever comes first, in the in-memory profile) and returns
    the decision for the session. A rejected batch produces no decision.

    Nothing outside the allow-list is stored or written to logs; the IP address is not
    persisted (01-arquitectura-mvp.md §10.2).
  x-invariants:
    - type: origin-not-allowed
      status: 403
      rule: if the request carries Origin, Origin belongs to the registered origins of the credential's merchant
      description: The credential is public; the registered origin is the other half of the control (ADR-014).
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/EventBatch.yaml
        examples:
          batch:
            $ref: ../examples/event-batch.yaml
  responses:
    "202":
      description: Batch accepted. Duplicates are reported per event; the decision is for the session.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/IngestResult.yaml
          examples:
            accepted:
              $ref: ../examples/ingest-result.yaml
            intervene:
              $ref: ../examples/ingest-result-intervene.yaml
    "400":
      $ref: ../components/responses/BadRequest.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "422":
      $ref: ../components/responses/EventBatchUnprocessable.yaml
    "500":
      $ref: ../components/responses/InternalServerError.yaml
