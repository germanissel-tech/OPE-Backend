get:
  operationId: listTreatmentDefaultsVersions
  tags:
    - admin
  security:
    - adminToken: []
  x-required-capabilities:
    - configuration:read
  x-collection: true
  summary: The published versions of the treatment defaults
  description: "Every version of level 2, newest first: nothing is overwritten and nothing is deleted
    (feature 036). The first one is the seed of the release; the rest an operator published. Paginated with
    an opaque cursor (ADR-020)."
  parameters:
    - $ref: ../components/parameters/cursor.yaml
    - $ref: ../components/parameters/limit.yaml
  responses:
    "200":
      description: A page of versions.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TreatmentDefaultsVersionPage.yaml
          example:
            items:
              - version: 3
                stampedAs: defaults-3
                content: &content
                  freshness:
                    catalogMs: 129600000
                    stockAndPriceMs: 900000
                  syncLevel:
                    receiptsKept: 8
                    noDataAfterMs: 129600000
                    minutesLevelMaxAgeMs: 3600000
                    minutesLevelMedianIntervalMs: 900000
                    minutesLevelMinReceipts: 3
                  holdoutShare: 0.1
                  decisionPolicy:
                    version: default-1
                    rules:
                      - id: price.price-read
                        barrier: price
                        strength: strong
                        when:
                          fact: dwellSeconds
                          block: price
                    weights:
                      strong: 0.4
                      supporting: 0.2
                    readingSeconds: 5
                    threshold: 0.6
                    priority:
                      - returns
                      - fit
                      - price
                    evidence:
                      freshStockAndPrice:
                        - price
                      availableVariant:
                        - fit
                  commercialPolicy:
                    version: commercial-default-1
                    maxIncentiveShare: 0.1
                    incentiveLadderShare:
                      - 5
                      - 10
                    directIncentiveOnPrice: true
                    returnRisk:
                      all:
                        - fact: eventCount
                          type: variant_selector_interacted
                          min: 2
                    highIntent: from-checkout
                    abandonment: reassure-returns
                    interventionsPerSession: 1
                    cooldownSeconds: 0
                    interventionsPerVisitorPerDay: 3
                  evidenceProfile:
                    returnsPolicy: false
                    fitData: false
                    authorizedAttributes: []
                  surfaces:
                    - product
                    - cart
                  barriers:
                    - fit
                    - price
                    - returns
                  syncStrategy:
                    catalog: push
                    stockAndPrice: push
                    orders: push
                    returns: push
                  platformSource: generic
                  confirmedOrderStates: []
                  syncCadence:
                    catalogMs: 86400000
                    stockAndPriceMs: 60000
                    stockAndPriceBatchSize: 200
                    ordersMs: 120000
                    returnsMs: 900000
                  noticeRetry:
                    afterMs: 60000
                    maxAttempts: 10
                  locales:
                    supported: []
                corrective: true
                reason: holdout raised to 10% before the pilot
                publishedAt: 2026-10-01T12:00:00Z
                operatorId: ops-1
    "400":
      $ref: ../components/responses/BadRequest.yaml
    "401":
      $ref: ../components/responses/OperatorUnauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "500":
      $ref: ../components/responses/InternalServerError.yaml
    "503":
      $ref: ../components/responses/ServiceUnavailable.yaml
