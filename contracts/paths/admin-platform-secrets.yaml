post:
  operationId: rotatePlatformSecret
  tags: [admin]
  security:
    - adminToken: []
  x-required-capabilities:
    - credentials:rotate
  summary: Rotate the signing secret
  description: |
    Mints a new signing secret for the notifications of the platform (ADR-029); a merchant created without one starts signing from now on. The new value travels in the answer and never again. The previous one stays valid
    for `graceSeconds` (none by default; bounded by the platform), then is refused; at most two
    are valid at a time — a second rotation within the grace expires the older one at once
    (ADR-014, ADR-029, ADR-031). A deactivated merchant cannot rotate (`409`).
  parameters:
    - $ref: ../components/parameters/merchantId.yaml
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CredentialRotation.yaml
        example:
          graceSeconds: 3600
  responses:
    "201":
      description: The credential minted; its value travels here and never again.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CredentialIssued.yaml
          example:
            kind: signing
            value: ope_ps_8K3n0m2XfQ1v7Yb4Z9cLt6Hs5RwPaJdE2uVgN1oCq0I
            issuedAt: "2026-09-20T12:00:00Z"
            previousExpiresAt: "2026-09-20T13:00:00Z"
    "400":
      $ref: ../components/responses/BadRequest.yaml
    "401":
      $ref: ../components/responses/OperatorUnauthorized.yaml
    "403":
      $ref: ../components/responses/MerchantForbidden.yaml
    "500":
      $ref: ../components/responses/InternalServerError.yaml
    "404":
      $ref: ../components/responses/MerchantNotFound.yaml
    "409":
      $ref: ../components/responses/MerchantDeactivatedConflict.yaml
    "422":
      $ref: ../components/responses/RotationUnprocessable.yaml
    "503":
      $ref: ../components/responses/ServiceUnavailable.yaml
