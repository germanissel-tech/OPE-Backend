post:
  operationId: confirmExposure
  tags: [ingest]
  security:
    - ingestKey: []
  x-required-capabilities:
    - events:write
  summary: Confirm the exposure of an intervention
  description: |
    The SDK confirms that the intervention of a decision was rendered and visible. Only then
    does an exposure exist (`EXPOSED` state of the evidence chain, 01 §5); the decision alone
    does not imply it. The decision must exist for the credential's merchant and must have
    been an intervention. A repeated confirmation does not duplicate the record.
  x-invariants:
    - type: exposure-decision-unknown
      status: 422
      rule: a decision with decisionId issued for the credential's merchant exists
      description: A decision of another merchant is treated as nonexistent (its existence is not revealed).
    - type: exposure-of-no-op
      status: 422
      rule: decision.outcome == INTERVENE
      description: A NO_OP decision has no intervention to expose.
    - type: origin-not-allowed
      status: 403
      rule: if the request carries Origin, Origin belongs to the registered origins of the credential's merchant
      description: Same as for ingestion.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ExposureConfirmation.yaml
        examples:
          exposure:
            $ref: ../examples/exposure-confirmation.yaml
  responses:
    "201":
      description: Exposure recorded.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ExposureResult.yaml
          examples:
            recorded:
              $ref: ../examples/exposure-recorded.yaml
    "200":
      description: Already recorded; nothing changed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ExposureResult.yaml
          example:
            decisionId: dec_01JBQ2X8N4K3M7P9R2T5V8W9
            status: already-recorded
    "400":
      $ref: ../components/responses/BadRequest.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "422":
      $ref: ../components/responses/ExposureUnprocessable.yaml
    "500":
      $ref: ../components/responses/InternalServerError.yaml
