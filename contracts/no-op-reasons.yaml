# Catalogue of NO_OP reasons (Decision.reason). Extended without an incompatible change: the
# contract declares it as a string with a pattern, not as an enum (ADR-014). Each reason is
# emitted by one authority; the ledger records it as is (constitution II: NO_OP with an
# explicit reason).
reasons:
  - slug: decision-plane-unavailable
    emitter: orchestrator
    description: No decision plane is available (features 004–009); every session resolves to NO_OP.
  - slug: page-context-incomplete
    emitter: orchestrator
    description: The page context is not enough to decide (for example, a product page without a resolved product).
