# Catalogue of NO_OP reasons (Decision.reason). Extended without an incompatible change: the
# contract declares it as a string with a pattern, not as an enum (ADR-014). Each reason is
# emitted by one authority; the ledger records it as is (constitution II: NO_OP with an
# explicit reason).
reasons:
  - slug: decision-plane-unavailable
    emitter: orchestrator
    description: No decision plane was available (features 004–010); kept for the decisions recorded before feature 011, no longer emitted.
  - slug: page-context-incomplete
    emitter: orchestrator
    description: The page context is not enough to decide (for example, a product page without a resolved product).
  - slug: control-arm
    emitter: assignment
    description: The visitor belongs to the CONTROL arm of the active experiment; the policy never intervenes (01 §4.1).
  - slug: no-active-experiment
    emitter: assignment
    description: The merchant has no active experiment; nothing is assigned and nothing is intervened.
  - slug: ledger-unavailable
    emitter: orchestrator
    description: The ledger could not accept the record; the intervention is suppressed rather than left unmeasured (01 §4.7).
  - slug: barrier-unclear
    emitter: decision
    description: No barrier reached the confidence threshold of the merchant's decision policy (01 §4.2); the inference is recorded.
  - slug: evidence-missing
    emitter: decision
    description: No product truth for the variant in focus (no catalogue, unknown product or variant, or no variant when the barrier needs one); OPE does not claim what it cannot sustain (01 §4.3).
  - slug: evidence-stale
    emitter: decision
    description: The product truth is older than the budget of the class the barrier needs (catalogue, or stock and price); fail-closed.
  - slug: variant-unavailable
    emitter: decision
    description: The variant in focus is not available and the barrier would recommend it; stock is a guard, never a claim (01 §4.3).
  - slug: high-intent
    emitter: decision
    description: The session shows high purchase intent under the merchant's policy (for example, it entered the checkout); interfering is not the right move (01 §4.5).
  - slug: session-budget-exhausted
    emitter: decision
    description: The session already received the interventions its policy allows.
  - slug: no-acceptable-candidate
    emitter: selection
    description: Every candidate intervention of the inferred barrier made a claim the evidence or the merchant's profile cannot sustain (01 §4.4); the quality gate rejected them all.
  - slug: commercial-policy-blocked
    emitter: commercial
    description: The commercial policy of the merchant blocked the candidate that would have been shown (margin not configured, incentives not allowed, or a high return risk) and no other candidate was acceptable (01 §4.5).
  - slug: visitor-fatigue
    emitter: commercial
    description: The visitor already received the interventions per day the merchant's commercial policy allows, across sessions.
  - slug: merchant-off
    emitter: orchestrator
    description: "The merchant's kill switch is off (01 §14.2): OPE decides nothing and intervenes nowhere for this merchant until an operator turns it back on; assignment is not consulted and no budget is consumed."
  - slug: message-unavailable
    emitter: selection
    description: No candidate of the dominant barrier has a curated text for the page's language and the merchant's voice (01 §322); the family is not a candidate, so nothing is shown. Distinct from no-acceptable-candidate, which is every candidate rejected for lack of evidence.
