openapi: 3.1.0
info:
  title: OPE Backend API
  version: 1.4.0
  # While no merchant consumes the contract, incompatible changes pass contract:diff with a
  # MINOR bump (ADR-003, precision of 2026-09-20). Remove before the first pilot.
  x-stability: building
  description: |
    HTTP API of the OPE backend. This document is the single source of truth for every HTTP
    surface: the server routes by `operationId` and validates request and response against
    it. Every error is expressed as Problem Details (RFC 9457) with `application/problem+json`.
    OPE stores no identifying information: no schema declares personal data.
  contact:
    name: OPE Backend
servers:
  - url: /
    description: Same origin (paths carry the major-version prefix)
tags:
  - name: ingest
    description: Ingestion of signals and confirmations from the merchant's SDK.
  - name: system
    description: Service status and support operations. No authentication.
  - name: outcomes
    description: What the merchant's platform pushes to OPE (catalogue, orders, returns). Server to server.
  - name: admin
    description: Administration of the platform by operators of OPE (merchants, credentials, configuration, experiments). Every action is logged.
paths:
  /v1/health:
    $ref: ./paths/health.yaml
  /v1/events:
    $ref: ./paths/events.yaml
  /v1/exposures:
    $ref: ./paths/exposures.yaml
  /v1/catalog:
    $ref: ./paths/catalog.yaml
  /v1/orders:
    $ref: ./paths/orders.yaml
  /v1/orders/corroborations:
    $ref: ./paths/order-corroborations.yaml
  /v1/returns:
    $ref: ./paths/returns.yaml
  /v1/admin/log:
    $ref: ./paths/admin-log.yaml
# Almost no `components` at the root: each file under components/ is referenced directly from
# where it is used and the bundle promotes them to `#/components/<type>/<FileName>`. Declaring
# them here would also trigger `oas3-unused-component`. Single exception (ADR-014): `security`
# references security schemes by name, not by `$ref`, so they have to exist here.
components:
  securitySchemes:
    ingestKey:
      $ref: ./components/securitySchemes/ingestKey.yaml
    platformKey:
      $ref: ./components/securitySchemes/platformKey.yaml
    adminToken:
      $ref: ./components/securitySchemes/adminToken.yaml
