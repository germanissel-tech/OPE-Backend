# Catalogue of problem types (RFC 9457 `type`). Single source: the server imports these
# constants and a test verifies that every emitted `type` belongs to the catalogue.
# URN scheme: urn:ope:problem:<slug>. Adding a type is compatible; changing or removing one is not.
namespace: "urn:ope:problem:"
types:
  - slug: validation-failed
    status: 400
    title: The request does not satisfy the contract
  - slug: unauthorized
    status: 401
    title: Credential missing or invalid
  - slug: not-found
    status: 404
    title: Path not declared in the contract
  - slug: method-not-allowed
    status: 405
    title: Method not declared for the path
  - slug: unprocessable
    status: 422
    title: Valid request rejected on semantics
  - slug: internal-error
    status: 500
    title: Internal error
  - slug: response-contract-violation
    status: 500
    title: The handler response does not satisfy the contract
  - slug: not-implemented
    status: 501
    title: Operation declared without a handler
  - slug: origin-not-allowed
    status: 403
    title: Origin not registered for the merchant
  - slug: session-visitor-mismatch
    status: 422
    title: The batch mixes sessions or visitors
  - slug: event-timestamp-out-of-range
    status: 422
    title: The event timestamp is out of tolerance
  - slug: exposure-decision-unknown
    status: 422
    title: The decision does not exist for this merchant
  - slug: exposure-of-no-op
    status: 422
    title: A NO_OP decision has no intervention to expose
  - slug: idempotency-conflict
    status: 409
    title: Same identity, different content
  - slug: ledger-unavailable
    status: 503
    title: The ledger is not available
  - slug: store-unavailable
    status: 503
    title: The store is not available
  - slug: invalid-treatment-share
    status: 422
    title: The treatment share of an experiment is out of range
  - slug: invalid-seed
    status: 422
    title: The seed of an experiment is empty
  - slug: invalid-origin
    status: 422
    title: A registered origin is not scheme://host[:port]
  - slug: invalid-platform-secret
    status: 500
    title: A platform signing secret is empty or collides with a key
  - slug: invalid-money
    status: 500
    title: A monetary amount or currency is malformed
  - slug: platform-key-collision
    status: 500
    title: A platform key is empty or equal to an ingest key
  - slug: invalid-ingest-keys
    status: 500
    title: A merchant needs one or two non-empty ingest keys
  - slug: invalid-origins
    status: 500
    title: A merchant needs at least one registered origin
  - slug: invalid-platform-keys
    status: 500
    title: A merchant has more than two platform keys
  - slug: invalid-platform-secrets
    status: 500
    title: A merchant has more than two platform signing secrets
  - slug: duplicate-experiment-id
    status: 500
    title: Two experiments of a merchant share an identifier
  - slug: payload-too-large
    status: 413
    title: The request body exceeds the limit of its consumer
  - slug: capability-missing
    status: 403
    title: The credential lacks a capability the operation requires
  - slug: catalog-duplicate-product-id
    status: 422
    title: Two products share an identifier
  - slug: catalog-duplicate-variant-id
    status: 422
    title: Two variants share an identifier
  - slug: catalog-captured-in-future
    status: 422
    title: The capture instant is in the future
  - slug: signature-missing
    status: 401
    title: The request is not signed
  - slug: signature-invalid
    status: 401
    title: The signature does not match
  - slug: signature-expired
    status: 401
    title: The signature timestamp is outside the window
  - slug: duplicate-order-item
    status: 422
    title: Two order lines share a SKU
  - slug: order-confirmed-in-future
    status: 422
    title: The confirmation instant is in the future
  - slug: corroboration-confirmed-in-future
    status: 422
    title: The confirmation instant is in the future
  - slug: order-unknown
    status: 422
    title: The order does not exist for this merchant
  - slug: return-items-not-in-order
    status: 422
    title: A returned item is not in the order
  - slug: catalog-out-of-order
    status: 422
    title: The snapshot is older than the current one
  - slug: invalid-sync-level-rules
    status: 500
    title: A synchronisation level threshold is not a positive integer
  - slug: invalid-freshness-budget
    status: 500
    title: A freshness budget is not a positive number of milliseconds
  - slug: invalid-rule-weight
    status: 500
    title: A rule weight or the policy weights are outside 0..1
  - slug: invalid-rule-threshold
    status: 500
    title: A rule threshold or the reading seconds are negative
  - slug: duplicate-rule-id
    status: 500
    title: Two rules of a decision policy share an id, or an id is empty
  - slug: unknown-barrier
    status: 500
    title: A rule names a barrier outside the closed vocabulary
  - slug: unknown-fact
    status: 500
    title: A condition references an event type, subtype or block OPE does not capture
  - slug: barrier-without-rules
    status: 500
    title: A decision policy has a barrier with no rule
  - slug: invalid-policy-version
    status: 500
    title: The decision policy version is empty
  - slug: invalid-policy-threshold
    status: 500
    title: The confidence threshold of a decision policy is outside 0..1
  - slug: invalid-policy-priority
    status: 500
    title: The priority of a decision policy is not a permutation of the three barriers
  - slug: invalid-policy-evidence
    status: 500
    title: The evidence requirements of a decision policy name an unknown barrier
  - slug: invalid-commercial-version
    status: 500
    title: The commercial policy version is empty
  - slug: invalid-incentive-ceiling
    status: 500
    title: The incentive ceiling is not an integer percentage between 0 and 100
  - slug: invalid-incentive-ladder
    status: 500
    title: The incentive ladder is not strictly increasing within 1 and the ceiling
  - slug: invalid-margin
    status: 500
    title: The margin is not a percentage between 0 and 100
  - slug: invalid-return-risk
    status: 500
    title: The return-risk condition references a fact OPE does not capture
  - slug: invalid-intervention-budget
    status: 500
    title: An interventions budget of the commercial policy is not an integer of at least 1
  - slug: invalid-cooldown
    status: 500
    title: The cooldown of the commercial policy is negative
  # Administration (feature 017, ADR-031): operators, merchants, configuration, experiments.
  - slug: operator-unknown
    status: 401
    title: Operator token missing or unknown
  - slug: merchant-out-of-scope
    status: 403
    title: The merchant is outside the operator's scope
  - slug: merchant-not-found
    status: 404
    title: The merchant does not exist
  - slug: merchant-deactivated
    status: 409
    title: The merchant is deactivated
  - slug: origin-already-registered
    status: 422
    title: An origin already belongs to another merchant
  - slug: rotation-grace-too-long
    status: 422
    title: The rotation grace exceeds the platform maximum
  - slug: configuration-frozen
    status: 409
    title: The configuration is frozen while an experiment is active
  - slug: configuration-reason-required
    status: 422
    title: A corrective configuration version needs a reason
  - slug: invalid-configuration-value
    status: 422
    title: A configuration value violates an invariant of its type
  - slug: experiment-already-open
    status: 409
    title: The merchant already has an open experiment
  - slug: experiment-not-open
    status: 409
    title: The experiment is not in a state that admits the transition
  - slug: invalid-experiment-cuts
    status: 422
    title: The experiment cuts are not strictly increasing
  - slug: invalid-target-sample
    status: 422
    title: The target sample is not an integer of at least 1
  - slug: treatment-exceeds-holdout
    status: 422
    title: The treatment share leaves less than the holdout of the merchant
  - slug: experiment-not-found
    status: 404
    title: The experiment does not exist
  - slug: invalid-operator-scope
    status: 500
    title: The scope of an operator is neither "*" nor a list of merchants
  - slug: invalid-operator-tokens
    status: 500
    title: An operator needs one or two non-empty token fingerprints
