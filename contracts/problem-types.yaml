# Catalogue of problem types (RFC 9457 `type`). Single source: the server imports these
# constants and a test verifies that every emitted `type` belongs to the catalogue.
# URN scheme: urn:ope:problem:<slug>. Adding a type is compatible; changing or removing one is not.
namespace: "urn:ope:problem:"
types:
  - slug: validation-failed
    status: 400
    title: The request does not satisfy the contract
  - slug: unauthorized
    status: 401
    title: Credential missing or invalid
  - slug: not-found
    status: 404
    title: Path not declared in the contract
  - slug: method-not-allowed
    status: 405
    title: Method not declared for the path
  - slug: unprocessable
    status: 422
    title: Valid request rejected on semantics
  - slug: internal-error
    status: 500
    title: Internal error
  - slug: response-contract-violation
    status: 500
    title: The handler response does not satisfy the contract
  - slug: not-implemented
    status: 501
    title: Operation declared without a handler
  - slug: origin-not-allowed
    status: 403
    title: Origin not registered for the merchant
  - slug: session-visitor-mismatch
    status: 422
    title: The batch mixes sessions or visitors
  - slug: event-timestamp-out-of-range
    status: 422
    title: The event timestamp is out of tolerance
  - slug: exposure-decision-unknown
    status: 422
    title: The decision does not exist for this merchant
  - slug: exposure-of-no-op
    status: 422
    title: A NO_OP decision has no intervention to expose
  - slug: idempotency-conflict
    status: 409
    title: Same identity, different content
