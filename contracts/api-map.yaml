# Contract map (ADR-019): every HTTP operation the backend exposes or will expose, before it is
# built. `openapi.yaml` describes what exists; this file describes what exists and what is
# planned. `npm run check:api-map` compares both ways: an operation in the contract without an
# entry here, or a `built` entry without its operation, fails the build.
#
# consumers: who calls the API. The tag of an operation fixes its consumer; the consumer fixes
#   its security scheme (a file under components/securitySchemes/, referenced from the root only
#   once an operation uses it) and the closed vocabulary of capabilities (ADR-020).
# roadmap: the product milestones that have no specs/ directory yet. Two namespaces that must
#   never be mixed: a built operation names the specs/NNN-* feature that built it (`feature`), a
#   planned one names the milestone that will bring it (`roadmap`). The field says which one it
#   is, so a three-digit number always means a directory under specs/.
# operations: status is one of planned | built | deprecated | retired.
consumers:
  public:
    securityScheme: null
    tags: [system]
    capabilities: []
  sdk:
    securityScheme: ingestKey
    tags: [ingest, decision]
    capabilities: [events:write, config:read, diagnostics:write, orders:corroborate]
  platform:
    securityScheme: platformKey
    tags: [outcomes]
    capabilities: [orders:write, returns:write, catalog:write]
  portal:
    securityScheme: portalSession
    tags: [portal]
    capabilities: [results:read, ledger:read]
  admin:
    securityScheme: adminToken
    tags: [admin]
    capabilities:
      [
        merchants:read,
        merchants:write,
        credentials:rotate,
        configuration:read,
        configuration:write,
        experiments:read,
        experiments:write,
        log:read,
        messages:publish,
      ]
roadmap:
  persistence-and-resilience: Persistence and resilience — durable ledgers and catalogue; record acceptance decoupled from ledger latency; read ports with a failure channel; decision plane separated from measurement; per-session budget atomicity (audit 014 F-043, F-045, F-046)
  platform-port: Platform port, per-flow sync strategy and adapters — the four operations of constitution X (fetchCatalog, fetchStockAndPrice, onOrderConfirmed, onReturnRegistered); push / pull / subscribe per flow negotiated per merchant; partial stock-and-price refresh with a per-item instant; scheduler and queue consumer outside the decision path; Magento 2 adapter and test adapter; end-to-end run event → decision → exposure → order → attribution (constitution X, 02 §6); preceded by the documentary verification of Magento 2 and VTEX
  message-catalogue: Message catalogue — curated, versioned texts per family and locale; message-unavailable when the page locale has no text and no declared fallback
  itt-and-portal: ITT analysis and merchant portal — health always visible, results only at pre-registered cuts (D-F); NOT_AVAILABLE as a first-class value
  observability: Observability and end-to-end — critical-path latency by percentile, NO_OP rate and reasons, catalogue ingest health, correlation completeness
