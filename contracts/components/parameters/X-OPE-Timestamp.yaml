name: X-OPE-Timestamp
in: header
required: false
description: |
  Unix time in seconds at which the platform signed the request (ADR-029). Required, together
  with `X-OPE-Signature`, for merchants with a signing secret configured; must be within 5
  minutes of the server clock either way (`401 signature-expired` otherwise).
schema:
  type: integer
  minimum: 0
