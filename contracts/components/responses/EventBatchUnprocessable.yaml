description: The batch satisfies the schema but violates an ingestion invariant.
content:
  application/problem+json:
    schema:
      $ref: ../schemas/ProblemDetails.yaml
    examples:
      sessionVisitorMismatch:
        summary: Two visitors in the same session
        value:
          type: urn:ope:problem:session-visitor-mismatch
          title: The batch mixes sessions or visitors
          status: 422
          instance: /v1/events
      timestampOutOfRange:
        summary: Timestamp out of tolerance
        value:
          type: urn:ope:problem:event-timestamp-out-of-range
          title: The event timestamp is out of tolerance
          status: 422
          instance: /v1/events
