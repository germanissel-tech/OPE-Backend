description: The confirmation satisfies the schema but cannot be recorded.
content:
  application/problem+json:
    schema:
      $ref: ../schemas/ProblemDetails.yaml
    examples:
      decisionUnknown:
        summary: Decision nonexistent or belonging to another merchant
        value:
          type: urn:ope:problem:exposure-decision-unknown
          title: The decision does not exist for this merchant
          status: 422
          instance: /v1/exposures
      noOp:
        summary: The decision was NO_OP
        value:
          type: urn:ope:problem:exposure-of-no-op
          title: A NO_OP decision has no intervention to expose
          status: 422
          instance: /v1/exposures
