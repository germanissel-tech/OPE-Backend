type: object
description: "One entry of the admin log (ADR-031): who did what, on which merchant, with which outcome. Never a credential."
additionalProperties: false
required: [at, operatorId, operation, outcome]
properties:
  at:
    type: string
    format: date-time
    description: Instant of the action.
  operatorId:
    $ref: ./OperatorId.yaml
  operation:
    type: string
    description: The `operationId` of the contract, or the name of a system action.
    maxLength: 64
  merchantId:
    type: string
    description: The merchant the action named, when it named one.
    maxLength: 64
  outcome:
    $ref: ./AdminOutcome.yaml
  code:
    type: string
    description: The problem type slug when rejected or denied.
    maxLength: 64
  result:
    $ref: ./AdminResult.yaml
  reason:
    type: string
    description: The reason the operator declared (a corrective configuration version).
    # 512 and not 500, which is the length the three publications accept (`MerchantConfigurationInput`,
    # `PlatformConfigurationInput`, `TreatmentDefaultsInput`). With 500 here, a reason of 501 to 512
    # characters was accepted and then made `GET /v1/admin/log` violate its own contract — a `500` on the
    # read, for something the write had allowed. Found by `test:contract` fuzzing the log after feature 036
    # gave it two more ways in; the defect is older, and the log has to be able to say what was declared.
    maxLength: 512
