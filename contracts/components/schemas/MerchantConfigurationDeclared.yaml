type: object
description: "Level 3: what a merchant overrides of the treatment defaults, plus its anchor map
  (which has no default). Every field is optional; a declared policy names its version and may
  declare only some of its fields."
additionalProperties: false
x-invariants:
  - type: duplicate-attribute-label
    status: 422
    rule: attributeLabels[].label are unique
    description: One label of the merchant pointing at two values of OPE's vocabulary; there would be no way to tell what a product carrying it says.
properties:
  freshness:
    $ref: ./FreshnessDeclared.yaml
  syncLevel:
    $ref: ./SyncLevelRulesDeclared.yaml
  holdoutShare:
    type: number
    description: Share of the traffic kept out of every experiment, as a fraction of 1; a merchant
      may set it to 0.
    minimum: 0
    maximum: 1
  decisionPolicy:
    $ref: ./DecisionPolicyDeclared.yaml
  commercialPolicy:
    $ref: ./CommercialPolicyDeclared.yaml
  evidenceProfile:
    $ref: ./EvidenceProfileDeclared.yaml
  surfaces:
    type: array
    description: Page types where OPE may intervene.
    minItems: 1
    maxItems: 2
    uniqueItems: true
    items:
      $ref: ./Surface.yaml
  barriers:
    type: array
    description: "Barriers OPE may infer for the merchant; the others are never dominant. No upper
      bound of its own: with unique items over a closed vocabulary the list cannot exceed it, and a
      number here would say «a merchant picks at most N» while meaning «N exist» — two things that
      stop coinciding the day one more barrier exists."
    minItems: 1
    uniqueItems: true
    items:
      $ref: ./Barrier.yaml
  syncStrategy:
    $ref: ./SyncStrategyDeclared.yaml
  locales:
    $ref: ./Locales.yaml
  attributeLabels:
    type: array
    description: What the merchant's own attribute labels correspond to in OPE's vocabulary; several labels may point at one value, one label at one only.
    maxItems: 256
    items:
      $ref: ./AttributeLabel.yaml
  anchors:
    $ref: ./AnchorMap.yaml
