description: |
  A behavioural event from the SDK. Closed allow-list (03-alcance-mvp.md §4.1): a type outside
  this union or an undeclared field rejects the whole batch (01 §10.3).
  The `mapping` is explicit so that the generated types carry the wire value; the server strips
  it before compiling the validators because Ajv does not support it (ADR-014).
# `type: object` is essential: Ajv applies `discriminator` only to objects and with it skips the
# `oneOf`, so without this line an event that is not an object would pass validation (R-05).
type: object
oneOf:
  - $ref: ./ProductViewed.yaml
  - $ref: ./ListingViewed.yaml
  - $ref: ./VariantSelectorInteracted.yaml
  - $ref: ./VariantSelected.yaml
  - $ref: ./PhotoInteracted.yaml
  - $ref: ./BlockDwelled.yaml
  - $ref: ./CtaApproached.yaml
  - $ref: ./ProductReturnedTo.yaml
  - $ref: ./AddedToCart.yaml
  - $ref: ./RemovedFromCart.yaml
  - $ref: ./CheckoutAdvanced.yaml
  - $ref: ./ExitSignaled.yaml
discriminator:
  propertyName: type
  mapping:
    product_viewed: ./ProductViewed.yaml
    listing_viewed: ./ListingViewed.yaml
    variant_selector_interacted: ./VariantSelectorInteracted.yaml
    variant_selected: ./VariantSelected.yaml
    photo_interacted: ./PhotoInteracted.yaml
    block_dwelled: ./BlockDwelled.yaml
    cta_approached: ./CtaApproached.yaml
    product_returned_to: ./ProductReturnedTo.yaml
    added_to_cart: ./AddedToCart.yaml
    removed_from_cart: ./RemovedFromCart.yaml
    checkout_advanced: ./CheckoutAdvanced.yaml
    exit_signaled: ./ExitSignaled.yaml
