type: object
description: "What an operator publishes as the next version of level 2: the values, whether the version
  is corrective and why.


  A level reaches **every** merchant that does not override what changed, so while any experiment it
  reaches is active only a corrective version is accepted — and it restarts the measurement window of each
  one (03 §4.10, ADR-031 as amended). The reason is where the operator's awareness of that is recorded."
additionalProperties: false
required:
  - content
properties:
  content:
    $ref: ./TreatmentDefaultsContent.yaml
  corrective:
    type: boolean
    description: "A corrective version: the only kind accepted while an experiment this change reaches is
      active; it restarts the measurement window of each one."
  reason:
    type: string
    description: Why the version is published; required when corrective.
    minLength: 1
    maxLength: 512
x-invariants:
  - type: configuration-reason-required
    status: 422
    rule: a corrective version carries a reason
    description: A change of a level reaches every merchant that does not override it, so a corrective one
      while measurements run must be explained in the log (03 §4.10).
  - type: invalid-configuration-value
    status: 422
    rule: every published value satisfies the invariants of its type (rates 0..1, increasing ladder,
      ceiling at or above the steps, language tags by shape, closed vocabularies)
    description: "Nothing invalid becomes a version: the pointer names the field (constitution XI)."
