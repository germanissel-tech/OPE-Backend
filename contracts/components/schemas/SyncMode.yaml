type: string
description: "How a flow of the platform reaches OPE (constitution X, ADR-025, ADR-047): `push` (the
  platform sends it, signed), `pull` (OPE reads the platform at the cadence of the merchant) or
  `subscribe` (the platform sends a notice and OPE reads what it announced; orders and returns only).
  What enters by a mode that is not the one in force is rejected."
enum:
  - push
  - pull
  - subscribe
