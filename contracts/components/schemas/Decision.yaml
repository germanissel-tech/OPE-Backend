type: object
description: |
  OPE's decision for the session after processing the batch. It always exists: not intervening
  is a result with a reason, never an absence (constitution II). `reason` is a string from the
  catalogue `contracts/no-op-reasons.yaml`; the catalogue grows without an incompatible change
  (which is why it is not an enum).
additionalProperties: false
required: [decisionId, sessionId, outcome, reason]
properties:
  decisionId:
    $ref: ./DecisionId.yaml
  sessionId:
    $ref: ./SessionId.yaml
  outcome:
    type: string
    description: |
      `NO_OP`: do not intervene; `reason` is a slug of `contracts/no-op-reasons.yaml`.
      `INTERVENE`: render `intervention`; `reason` is the inferred barrier (`fit`, `price` or
      `returns`, 03 §4.2). Neither the confidence nor the signals travel: they live in the ledger.
    enum: [NO_OP, INTERVENE]
  reason:
    type: string
    description: |
      Reason for the outcome: a NO_OP reason of the catalogue `contracts/no-op-reasons.yaml`
      (for example `barrier-unclear`), or the barrier of an intervention.
    pattern: "^[a-z][a-z0-9-]*$"
  intervention:
    $ref: ./Intervention.yaml
