type: object
description: "Holds when at least one fact holds (`any: []` does not); the innermost level of the algebra the API admits."
additionalProperties: false
required: [any]
properties:
  any:
    type: array
    description: Facts of which one must hold.
    maxItems: 16
    items:
      type: object
      description: A fact of the closed vocabulary.
      oneOf:
        - $ref: ./EventCountCondition.yaml
        - $ref: ./DwellSecondsCondition.yaml
        - $ref: ./SequenceCondition.yaml
        - $ref: ./ProductAttributeCondition.yaml
        - $ref: ./FlagCondition.yaml
