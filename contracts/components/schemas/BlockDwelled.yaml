type: object
description: Scroll and dwell over a block of the product page.
additionalProperties: false
required: [type, eventId, sessionId, visitorId, occurredAt, page, device, block, dwellMs]
properties:
  type:
    type: string
    description: Discriminator of the event type.
    enum: [block_dwelled]
  eventId:
    $ref: ./EventId.yaml
  sessionId:
    $ref: ./SessionId.yaml
  visitorId:
    $ref: ./VisitorId.yaml
  occurredAt:
    type: string
    format: date-time
    description: >-
      Instant of the event according to the browser (RFC 3339). Accepted tolerance: up to 5
      minutes in the future and 24 hours in the past relative to the backend clock; beyond that,
      `event-timestamp-out-of-range`.
  page:
    $ref: ./PageContext.yaml
  device:
    $ref: ./DeviceClass.yaml
  block:
    type: string
    description: Semantic block of the product page the visitor dwelled on.
    enum: [description, size_guide, reviews, policies, price, gallery, cta]
  dwellMs:
    type: integer
    description: Milliseconds of dwell over the block.
    minimum: 0
    maximum: 3600000
