type: object
description: |
  PROPUESTO — Placeholder for the intervention the decision plane will emit in later features.
  The SDK team validates this shape before 010; until then no decision carries it (`outcome`
  is always `NO_OP`).
additionalProperties: false
required: [messageVersionId, anchor]
properties:
  messageVersionId:
    type: string
    description: Version of the curated message to render. The text is served by the message catalogue, not by this contract.
    maxLength: 128
  anchor:
    $ref: ./Anchor.yaml
