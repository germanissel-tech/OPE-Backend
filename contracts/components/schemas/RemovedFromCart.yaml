type: object
description: Removal from the cart. The return to the product page arrives as a later `product_viewed`; together they are the barrier amplifier (03 §4.2).
additionalProperties: false
required: [type, eventId, sessionId, visitorId, occurredAt, page, device]
properties:
  type:
    type: string
    description: Discriminator of the event type.
    enum: [removed_from_cart]
  eventId:
    $ref: ./EventId.yaml
  sessionId:
    $ref: ./SessionId.yaml
  visitorId:
    $ref: ./VisitorId.yaml
  occurredAt:
    type: string
    format: date-time
    description: >-
      Instant of the event according to the browser (RFC 3339). Accepted tolerance: up to 5
      minutes in the future and 24 hours in the past relative to the backend clock; beyond that,
      `event-timestamp-out-of-range`.
  page:
    $ref: ./PageContext.yaml
  device:
    $ref: ./DeviceClass.yaml
