type: object
description: "An experiment of a merchant as the administration reads it (ADR-022, D-G): its state and instants; never the seed."
additionalProperties: false
required:
  - experimentId
  - status
  - treatmentShare
  - targetSample
  - cuts
  - openedAt
  - windowRestarts
properties:
  experimentId:
    $ref: ./ExperimentId.yaml
  status:
    $ref: ./ExperimentStatus.yaml
  treatmentShare:
    type: number
    description: "Share of visitors assigned to TREATMENT, as a fraction of 1. The assignment resolves to whole buckets of one hundredth, so a finer value takes the nearest bucket."
    minimum: 0
    maximum: 1
  targetSample:
    type: integer
    description: Visitors the accumulation window aims at.
    minimum: 1
  cuts:
    type: array
    description: Interim cuts as fractions of the target sample, strictly increasing; empty when the target sample is the only cut.
    items:
      type: number
      exclusiveMinimum: 0
      maximum: 1
  openedAt:
    type: string
    format: date-time
    description: When the experiment was opened (calibration starts).
  activatedAt:
    type: string
    format: date-time
    description: When it was activated; absent while calibrating or when closed from calibration.
  windowStartedAt:
    type: string
    format: date-time
    description: Start of the accumulation window in force — the activation or the last restart; absent while calibrating.
  closedAt:
    type: string
    format: date-time
    description: When it was closed; absent while open.
  windowRestarts:
    type: array
    description: Every restart of the accumulation window, oldest first.
    items:
      $ref: ./WindowRestart.yaml
