type: object
description: "Level 2 (constitution XI): what every merchant gets unless it declares otherwise, with the
  name of the version in force. The release file (`config/treatment-defaults.json`) is the seed of version
  1; from there on an operator publishes it by API (ADR-031 as amended by feature 036)."
additionalProperties: false
required:
  - version
  - freshness
  - syncLevel
  - holdoutShare
  - decisionPolicy
  - commercialPolicy
  - evidenceProfile
  - surfaces
  - barriers
  - syncStrategy
  - platformSource
  - confirmedOrderStates
  - syncCadence
  - noticeRetry
  - locales
properties:
  version:
    type: string
    description: "Name of the version in force (`defaults-3`), minted from its number."
    minLength: 1
    maxLength: 64
  freshness:
    $ref: ./Freshness.yaml
  syncLevel:
    $ref: ./SyncLevelRules.yaml
  holdoutShare:
    type: number
    description: Share of the traffic kept out of every experiment, as a fraction of 1; a merchant
      may set it to 0.
    minimum: 0
    maximum: 1
  decisionPolicy:
    $ref: ./DecisionPolicy.yaml
  commercialPolicy:
    $ref: ./CommercialPolicy.yaml
  evidenceProfile:
    $ref: ./EvidenceProfile.yaml
  surfaces:
    type: array
    description: Page types where OPE may intervene.
    minItems: 1
    maxItems: 2
    uniqueItems: true
    items:
      $ref: ./Surface.yaml
  barriers:
    type: array
    description: Barriers OPE may infer for the merchant; the others are never dominant.
    minItems: 1
    maxItems: 3
    uniqueItems: true
    items:
      $ref: ./Barrier.yaml
  syncStrategy:
    $ref: ./SyncStrategy.yaml
  platformSource:
    $ref: ./PlatformSource.yaml
  confirmedOrderStates:
    type: array
    description: "The states of the platform in which an order brought by `pull` or `subscribe` counts as
      confirmed (ADR-047); by `push` it does nothing, because the platform decides what it pushes. A
      configuration with orders in `pull` or `subscribe` and no state is rejected: no order would enter
      and nothing would say so."
    maxItems: 32
    uniqueItems: true
    items:
      type: string
      minLength: 1
      maxLength: 64
  syncCadence:
    $ref: ./SyncCadence.yaml
  noticeRetry:
    $ref: ./NoticeRetry.yaml
  locales:
    $ref: ./Locales.yaml
