type: object
description: "The configuration a merchant is served with, resolved value by value: what it
  declared, else the treatment defaults, with the platform values on top (constitution XI). Never a
  secret."
additionalProperties: false
required:
  - freshness
  - syncLevel
  - holdoutShare
  - decisionPolicy
  - commercialPolicy
  - evidenceProfile
  - surfaces
  - barriers
  - syncStrategy
  - locales
  - platform
properties:
  freshness:
    $ref: ./Freshness.yaml
  syncLevel:
    $ref: ./SyncLevelRules.yaml
  holdoutShare:
    type: number
    description: Share of the traffic kept out of every experiment, as a fraction of 1; a merchant
      may set it to 0.
    minimum: 0
    maximum: 1
  decisionPolicy:
    $ref: ./DecisionPolicy.yaml
  commercialPolicy:
    $ref: ./CommercialPolicy.yaml
  evidenceProfile:
    $ref: ./EvidenceProfile.yaml
  surfaces:
    type: array
    description: Page types where OPE may intervene.
    minItems: 1
    maxItems: 2
    uniqueItems: true
    items:
      $ref: ./Surface.yaml
  barriers:
    type: array
    description: Barriers OPE may infer for the merchant; the others are never dominant.
    minItems: 1
    maxItems: 3
    uniqueItems: true
    items:
      $ref: ./Barrier.yaml
  syncStrategy:
    $ref: ./SyncStrategy.yaml
  locales:
    $ref: ./Locales.yaml
  attributeLabels:
    type: array
    description: What the merchant's own attribute labels correspond to in OPE's vocabulary; several labels may point at one value, one label at one only.
    maxItems: 256
    items:
      $ref: ./AttributeLabel.yaml
  anchors:
    $ref: ./AnchorMap.yaml
  platform:
    $ref: ./PlatformConfiguration.yaml
