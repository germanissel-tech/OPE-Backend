type: object
description: Checkout progress. OPE observes the transition to infer and measure; it does not intervene there.
additionalProperties: false
required: [type, eventId, sessionId, visitorId, occurredAt, page, device, step]
properties:
  type:
    type: string
    description: Discriminator of the event type.
    enum: [checkout_advanced]
  eventId:
    $ref: ./EventId.yaml
  sessionId:
    $ref: ./SessionId.yaml
  visitorId:
    $ref: ./VisitorId.yaml
  occurredAt:
    type: string
    format: date-time
    description: >-
      Instant of the event according to the browser (RFC 3339). Accepted tolerance: up to 5
      minutes in the future and 24 hours in the past relative to the backend clock; beyond that,
      `event-timestamp-out-of-range`.
  page:
    $ref: ./PageContext.yaml
  device:
    $ref: ./DeviceClass.yaml
  step:
    type: string
    description: Step reached.
    enum: [cart, checkout_started, shipping, payment, review]
