type: object
description: "A published version of a merchant's configuration (01 §14.2): numbered, immutable,
  with who published it and why."
additionalProperties: false
required:
  - version
  - declared
  - corrective
  - publishedAt
  - operatorId
properties:
  version:
    type: integer
    description: Sequential number per merchant, assigned at publication.
    minimum: 1
  declared:
    $ref: ./MerchantConfigurationDeclared.yaml
  corrective:
    type: boolean
    description: Whether the version was published as corrective.
  reason:
    type: string
    description: The reason the operator declared, when any.
    maxLength: 512
  publishedAt:
    type: string
    format: date-time
    description: Instant of publication.
  operatorId:
    $ref: ./OperatorId.yaml
  windowsRestarted:
    type: array
    description: "The experiment whose measurement window this version restarted, when it was corrective:
      the active one of this merchant, if the change reached it. Every reading of the version returns it: its publication, a repetition of the same body, the history and the version by number. A version published before its restarts were recorded (feature 036; 038 for texts) carries none."
    uniqueItems: true
    items:
      $ref: ./ExperimentId.yaml
