type: object
description: "What an operator declares to open an experiment (ADR-022, D-G): the split, the seed of the assignment key, the target sample and the cuts at which its result may be read (D-F). Split and seed are immutable: changing them is another experiment."
additionalProperties: false
required:
  - treatmentShare
  - seed
  - targetSample
properties:
  treatmentShare:
    type: number
    description: "Share of the merchant's visitors assigned to TREATMENT, as a fraction of 1; the rest is CONTROL. It cannot exceed what the holdout of the merchant leaves (`1 − holdoutShare`). The assignment splits the visitors into whole buckets of one hundredth, so the share has to be one of them: `0.07` is a share, `0.075` is not."
    minimum: 0
    maximum: 1
  seed:
    type: string
    description: Part of the assignment key; never shown again.
    minLength: 1
    maxLength: 128
  targetSample:
    type: integer
    description: Visitors the accumulation window aims at; the last cut.
    minimum: 1
  cuts:
    type: array
    description: "Interim cuts as fractions of the target sample, strictly increasing (D-F: results are read only at pre-fixed cuts). Without cuts, the target sample is the only one."
    maxItems: 10
    items:
      type: number
      exclusiveMinimum: 0
      maximum: 1
x-invariants:
  - type: invalid-experiment-cuts
    status: 422
    rule: the cuts are strictly increasing fractions
    description: A cut that does not follow the previous one is a mistake, not an order (D-F).
  - type: treatment-share-too-fine
    status: 422
    rule: treatmentShare is one of the buckets the assignment splits the visitors into
    description: "A finer share would be rounded to the nearest bucket without saying so, and the split that ran would not be the one that was declared: `0.004` would assign nobody (ADR-035)."
