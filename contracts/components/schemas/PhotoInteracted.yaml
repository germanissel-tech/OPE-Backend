type: object
description: Zoom o navegación entre fotos del producto.
additionalProperties: false
required: [type, eventId, sessionId, visitorId, occurredAt, page, device, interaction]
properties:
  type:
    type: string
    description: Discriminador del tipo de evento.
    enum: [photo_interacted]
  eventId:
    $ref: ./EventId.yaml
  sessionId:
    $ref: ./SessionId.yaml
  visitorId:
    $ref: ./VisitorId.yaml
  occurredAt:
    type: string
    format: date-time
    description: >-
      Instante del evento según el navegador (RFC 3339). Tolerancia aceptada: hasta 5 minutos a
      futuro y 24 horas a pasado respecto del reloj del backend; fuera de eso,
      `event-timestamp-out-of-range`.
  page:
    $ref: ./PageContext.yaml
  device:
    $ref: ./DeviceClass.yaml
  interaction:
    type: string
    description: Qué hizo el visitante con las fotos.
    enum: [zoom, navigate]
