type: object
description: "Level 1 (constitution XI): the values of the platform that no merchant overrides, as
  the release declares them (`config/platform.json`); read-only by API."
additionalProperties: false
required:
  - version
  - dedupWindow
  - eventPastToleranceMs
  - clockSkewToleranceMs
  - sessionDurationMs
  - visitorWindowMs
  - signatureWindowMs
  - rotationGraceMaxMs
  - anchorDiagnosticsKept
  - unmappedValuesKept
  - retryAfterSeconds
properties:
  version:
    type: string
    description: Version of the platform configuration the release declares.
    minLength: 1
    maxLength: 64
  dedupWindow:
    $ref: ./DedupWindow.yaml
  eventPastToleranceMs:
    type: integer
    description: Milliseconds an event instant may sit in the past (late uploads).
    minimum: 1
    maximum: 31536000000
  clockSkewToleranceMs:
    type: integer
    description: Milliseconds an instant a client declares may sit in the future.
    minimum: 0
    maximum: 31536000000
  sessionDurationMs:
    type: integer
    description: "Milliseconds of inactivity after which a session is over and the SDK must mint a new
      `sessionId`. It is a rule of the backend that the SDK obeys, not an observation the client makes
      (feature 032). It used to be called `sessionWindowMs` and meant two things at once — this rule and
      how long the backend keeps the session in memory; those are now separate, and the second one is not
      published because nothing a merchant observes depends on it."
    minimum: 1
    maximum: 31536000000
  visitorWindowMs:
    type: integer
    description: Milliseconds a visitor's interventions count for the fatigue limit.
    minimum: 1
    maximum: 31536000000
  signatureWindowMs:
    type: integer
    description: Milliseconds a platform signature's timestamp may sit from the server clock, either way
      (ADR-029).
    minimum: 1
    maximum: 31536000000
  rotationGraceMaxMs:
    type: integer
    description: Longest grace a credential rotation may give the previous credential.
    minimum: 0
    maximum: 31536000000
  anchorDiagnosticsKept:
    type: integer
    description: Anchor diagnostics kept per merchant at most.
    minimum: 1
    maximum: 1000000
  unmappedValuesKept:
    type: integer
    description: Unmapped attribute labels kept per merchant at most; past it the oldest is dropped and the catalogue is never refused.
    minimum: 1
    maximum: 1000000
  retryAfterSeconds:
    type: integer
    description: "Seconds a client waits before retrying a write a store could not accept: the `Retry-After` of every 503 (ADR-021)."
    minimum: 1
    maximum: 3600
