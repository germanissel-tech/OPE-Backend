type: object
description: Service status.
additionalProperties: false
required: [status, contractVersion, timestamp]
properties:
  status:
    type: string
    description: >-
      `ok` when the service can serve requests. `degraded` is reserved for when external
      dependencies exist whose outage does not prevent responding.
    enum: [ok, degraded]
  contractVersion:
    type: string
    description: Semantic version of the OpenAPI contract the server loaded at startup.
    pattern: '^\d+\.\d+\.\d+$'
  timestamp:
    type: string
    format: date-time
    description: UTC instant at which the response was produced (RFC 3339).
