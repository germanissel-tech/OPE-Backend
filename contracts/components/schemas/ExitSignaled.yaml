type: object
description: Exit signal. Exactly the four of 03 §4.1; adding one is a scope change.
additionalProperties: false
required: [type, eventId, sessionId, visitorId, occurredAt, page, device, signal]
properties:
  type:
    type: string
    description: Discriminator of the event type.
    enum: [exit_signaled]
  eventId:
    $ref: ./EventId.yaml
  sessionId:
    $ref: ./SessionId.yaml
  visitorId:
    $ref: ./VisitorId.yaml
  occurredAt:
    type: string
    format: date-time
    description: >-
      Instant of the event according to the browser (RFC 3339). Accepted tolerance: up to 5
      minutes in the future and 24 hours in the past relative to the backend clock; beyond that,
      `event-timestamp-out-of-range`.
  page:
    $ref: ./PageContext.yaml
  device:
    $ref: ./DeviceClass.yaml
  signal:
    type: string
    description: Which of the four exit signals.
    enum: [inactivity, tab_hidden, back_navigation, exit_intent]
