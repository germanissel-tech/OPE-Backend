type: object
description: >-
  Error according to RFC 9457 (Problem Details for HTTP APIs). Every 4xx/5xx response of the
  API uses this schema with the `application/problem+json` content type. The values of `type`
  belong to the catalogue `contracts/problem-types.yaml` (URN `urn:ope:problem:<slug>`).
additionalProperties: false
required: [type, title, status]
properties:
  type:
    type: string
    format: uri
    description: Stable identifier of the problem type, from OPE's catalogue.
  title:
    type: string
    description: Short, fixed summary for the problem type.
  status:
    type: integer
    minimum: 400
    maximum: 599
    description: HTTP status code of the response, repeated in the body.
  detail:
    type: string
    description: Human-readable explanation of this occurrence. Never includes internal details.
  instance:
    type: string
    description: URI reference of the occurrence; usually the request path.
  errors:
    type: array
    description: Individual contract violations. Present only in `400` and `422`.
    items:
      type: object
      description: One contract violation in the request.
      additionalProperties: false
      required: [pointer, message]
      properties:
        pointer:
          type: string
          description: JSON Pointer relative to the request (`/query/foo`, `/body/kind`, `/headers/x`).
        message:
          type: string
          description: Description of the violation.
