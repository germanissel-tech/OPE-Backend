type: object
description: The control that picks a variant was interacted with. What the system reads is that it happened and how often; which variant was chosen is `variant_selected`.
additionalProperties: false
required: [type, eventId, sessionId, visitorId, occurredAt, page, device]
properties:
  type:
    type: string
    description: Discriminator of the event type.
    enum: [variant_selector_interacted]
  eventId:
    $ref: ./EventId.yaml
  sessionId:
    $ref: ./SessionId.yaml
  visitorId:
    $ref: ./VisitorId.yaml
  occurredAt:
    type: string
    format: date-time
    description: >-
      Instant of the event according to the browser (RFC 3339). Accepted tolerance: up to 5
      minutes in the future and 24 hours in the past relative to the backend clock; beyond that,
      `event-timestamp-out-of-range`.
  page:
    $ref: ./PageContext.yaml
  device:
    $ref: ./DeviceClass.yaml
