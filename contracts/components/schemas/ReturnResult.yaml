type: object
description: The order is returned; `correlation` says whether OPE had linked it to a session.
additionalProperties: false
required: [orderId, status, correlation, receivedAt]
properties:
  orderId:
    $ref: ./OrderId.yaml
  status:
    type: string
    description: The order came back (`RETURNED` state of the evidence chain, 01 §5).
    enum: [RETURNED]
  correlation:
    $ref: ./Correlation.yaml
  receivedAt:
    type: string
    format: date-time
    description: Instant OPE recorded the return (the first receipt, when repeated).
