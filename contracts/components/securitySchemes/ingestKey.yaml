type: apiKey
in: header
name: X-OPE-Ingest-Key
description: |
  Ingest credential of the merchant. It is **public**: it travels in the tag the merchant
  installs (02-integracion-ecommerce.md §3), identifies the merchant and does not authenticate
  the visitor. The real protection is the pair credential + registered origin of the merchant
  (the browser's `Origin`; see ADR-014). Rotatable: up to two active keys per merchant during a
  rotation. Distinct from the portal credentials. `merchantId` is derived from it and never
  travels in the request (constitution V).
