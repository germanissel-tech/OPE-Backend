openapi: 3.1.0
info:
  title: f
  version: 1.0.0
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags:
        - system
      security: []
      responses:
        "200":
          description: ok
  /v1/events:
    post:
      operationId: ingestEvents
      tags:
        - ingest
      security:
        - ingestKey: []
      x-required-capabilities:
        - events:write
      responses:
        "202":
          description: ok
  /v1/old-things:
    get:
      operationId: listOldThings
      tags:
        - ingest
      deprecated: true
      security:
        - ingestKey: []
      x-required-capabilities:
        - events:write
      responses:
        "200":
          description: ok
  /v1/gone:
    get:
      operationId: listGone
      tags:
        - ingest
      security:
        - ingestKey: []
      x-required-capabilities:
        - events:write
      responses:
        "200":
          description: ok
components:
  securitySchemes:
    ingestKey:
      type: apiKey
      in: header
      name: X-OPE-Ingest-Key
