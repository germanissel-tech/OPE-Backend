# Configuration of Schemathesis for npm run test:contract (scripts/test-contract.mjs). Schemathesis
# discovers this file by itself in the working directory; passing another one with --config-file
# replaces it instead of adding to it (feature 043 learned that in CI).
#
# A schema-valid request may be refused by an invariant declared in `x-invariants` (422 with its type
# from the catalogue, ADR-007): for Schemathesis that is not an undue rejection. Every other check keeps
# its defaults.
[checks.positive_data_acceptance]
expected-statuses = ["2xx", 401, 403, 404, 409, 422, 429, "5xx"]

# The platform operations (tag `outcomes`) declare the two signature headers (ADR-029) and since 015
# (F-054) are exercised with their credential. Two limits of Schemathesis with those header parameters:
# (a) the negative case "unexpected property" sends them as an unknown header, which no HTTP API refuses;
# `allow-extra-parameters = false` skips it (also for the body: that an unknown body field is a 400 is
# proved by tests/integration); (b) the coverage phase ignores `pattern` in headers and sends
# `X-OPE-Signature: 0` as conforming, which the contract refuses with 400 (`/header/x-ope-signature`):
# in that phase the check admits 400.
[[operations]]
include-tag = "outcomes"
[operations.generation]
allow-extra-parameters = false
[operations.phases.coverage.checks.positive_data_acceptance]
expected-statuses = ["2xx", 400, 401, 403, 404, 409, 422, 429, "5xx"]

# The four writes that replace what they read require the witness of what they read (feature 043,
# ADR-046). Two checks disagree with the contract there, not with the server:
#   - missing_required_header expects a 400-family answer; the contract answers 428 witness-required,
#     a status of its own, declared on the parameter with x-when-missing.
#   - positive_data_acceptance sends a schema-valid If-Match, which is never the current witness of the
#     resource; 412 stale-version is the answer the contract declares for it.
[[operations]]
include-operation-id = [
  "publishPlatformConfiguration",
  "publishTreatmentDefaults",
  "publishMerchantConfiguration",
  "updateMerchantProfile",
]
checks.missing_required_header.expected-statuses = [428]
checks.positive_data_acceptance.expected-statuses = ["2xx", 401, 403, 404, 409, 412, 422, 429, "5xx"]
